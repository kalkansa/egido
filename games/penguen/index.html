<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kara Tahta</title>
<link rel="icon" type="image/svg+xml" href="../../shared/logo.svg?v=202610051251">
<link rel="stylesheet" href="../../shared/egido.css?v=202610051258">
<style>
  /* ---------- Öğretmen: soru listesi ---------- */
  .qs { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  .qitem { background: #f1f5fb; border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; }
  .qitem .top { display: flex; gap: 8px; align-items: center; }
  .qitem .no { font-weight: 800; color: var(--muted); width: 26px; text-align: center; }
  .qitem .top input { flex: 1; margin: 0; }
  .qitem .rm { background: none; border: 0; color: var(--bad); font-size: 20px; cursor: pointer; padding: 4px 8px; }
  .qitem .answers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  @media (max-width: 720px) { .qitem .answers { grid-template-columns: 1fr 1fr; } }
  .qitem .answers input { margin: 0; font-size: 14px; }
  .qitem .a-ok { border-color: #bfe9cf; background: #f4fff7; } .qitem .a-ok:focus { border-color: var(--ok); }
  .qitem .a-bad { border-color: #f5c6c1; } .qitem .a-bad:focus { border-color: var(--bad); }
  .addrow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }

  /* ---------- Oyun ---------- */
  body.playing { background: linear-gradient(180deg, #0b2a4a 0%, #0e4d7a 40%, #1a7fb5 100%); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
  .qbar { position: absolute; top: 58px; left: 0; right: 0; padding: 6px 18px; text-align: center; pointer-events: none; z-index: 2; }
  .qbar div { display: inline-block; max-width: min(1100px, 96%); background: rgba(0,0,0,.35); backdrop-filter: blur(4px); color: #fff; border-radius: 16px; padding: 10px 22px; font-weight: 800; font-size: clamp(20px, 3.2vw, 34px); line-height: 1.25; text-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .flashBad { position: fixed; inset: 0; pointer-events: none; z-index: 3; box-shadow: inset 0 0 160px rgba(10,40,80,0); transition: box-shadow .6s; }
  .flashBad.on { box-shadow: inset 0 0 220px rgba(10,40,80,.95); transition: none; }
</style>
</head>
<body>

<!-- ===================== ÖĞRETMEN KURULUM ===================== -->
<div id="setup" class="screen">
  <div class="card">
    <div id="teacherBarHost"></div>
    <h1 data-i18n="penguen.title"></h1>
    <p class="sub" data-i18n="penguen.sub"></p>
    <div class="row" style="margin:0 0 4px"><button class="btn secondary small" id="btnExample" data-i18n="setup.example"></button></div>

    <div class="cols three">
      <div>
        <label for="blocks" data-i18n="penguen.blocks"></label>
        <select id="blocks"><option value="3" data-i18n="penguen.blocks3"></option><option value="4" selected data-i18n="penguen.blocks4"></option></select>
      </div>
      <div>
        <label for="lives" data-i18n="balon.lives"></label>
        <select id="lives"><option value="1" selected data-i18n="penguen.lives1"></option><option value="3" data-i18n="penguen.lives3"></option></select>
      </div>
      <div>
        <label for="time" data-i18n="puzzle.time"></label>
        <select id="time"><option value="0" selected data-i18n="puzzle.noTime"></option><option value="15">15 s</option><option value="30">30 s</option><option value="45">45 s</option></select>
      </div>
    </div>

    <label data-i18n="penguen.items"></label>
    <div class="qs" id="qs"></div>
    <div class="addrow">
      <button class="btn secondary" id="btnAdd" data-i18n="penguen.add"></button>
    </div>
    <div class="cols" style="margin-top:6px">
      <div>
        <label for="order" data-i18n="puzzle.order"></label>
        <select id="order"><option value="fixed" selected data-i18n="puzzle.fixed"></option><option value="random" data-i18n="puzzle.random"></option></select>
      </div>
    </div>
    <p class="hint" data-i18n="penguen.help"></p>

    <div class="err" id="setupErr"></div>
    <div class="row">
      <button class="btn" id="btnStart" data-i18n="setup.try"></button>
      <button class="btn" id="btnShare" data-i18n="setup.code"></button>
      <button class="btn secondary" id="btnLbSetup" data-i18n="setup.lb"></button>
    </div>
    <div id="sharePanelHost"></div>
  </div>
</div>

<!-- ===================== OYUN ===================== -->
<div id="game" class="screen hidden">
  <div class="hud">
    <div class="pill" id="hudPlayer">👤</div>
    <div class="pill progress" id="hudScore">⭐ 0</div>
    <div class="q"></div>
    <div class="pill progress" id="hudProg">🐧 1/1</div>
    <div class="pill lives" id="hudLives">❤</div>
    <div class="pill progress" id="hudTime">⏱ 30</div>
    <div class="pill pauseBtn" id="btnQuit">✕</div>
  </div>
  <div class="qbar"><div id="hudQ"></div></div>
  <canvas id="c"></canvas>
  <div class="flashBad" id="flashBad"></div>
  <div id="countdown" class="hidden"></div>
</div>

<script src="../../shared/config.js?v=202610051258"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../../shared/i18n.js?v=202610051258"></script>
<script src="../../shared/ui.js?v=202610051258"></script>
<script src="../../shared/header.js?v=202610051258"></script>
<script src="../../shared/egido.js?v=202610051258"></script>
<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const t = I18N.t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const ease = x => 1 - Math.pow(1 - x, 3);
  const { sfx, tone, escapeHtml, shuffle } = Egido;

  // ---------- Öğretmen ----------
  let qs = []; // [{ q, a, w: ['', '', ''] }]
  const nWrong = () => +$('#blocks').value - 1;
  function renderQs() {
    const box = $('#qs'), nw = nWrong();
    box.innerHTML = qs.map((it, i) => `
      <div class="qitem" data-i="${i}">
        <div class="top"><span class="no">${i + 1}</span><input type="text" class="q" placeholder="${t('penguen.qPh')}" maxlength="160" value="${escapeHtml(it.q)}"><button class="rm" title="${t('puzzle.remove')}">✕</button></div>
        <div class="answers">
          <input type="text" class="a a-ok" placeholder="${t('penguen.aPh')}" maxlength="40" value="${escapeHtml(it.a)}">
          ${[0, 1, 2].slice(0, nw).map(k => `<input type="text" class="w a-bad" data-k="${k}" placeholder="${t('penguen.wPh', { n: k + 1 })}" maxlength="40" value="${escapeHtml(it.w[k] || '')}">`).join('')}
        </div>
      </div>`).join('') || `<div class="hint">${t('penguen.noItems')}</div>`;
    box.querySelectorAll('.qitem').forEach(row => {
      const i = +row.dataset.i;
      row.querySelector('.q').oninput = e => { qs[i].q = e.target.value; };
      row.querySelector('.a').oninput = e => { qs[i].a = e.target.value; };
      row.querySelectorAll('.w').forEach(inp => inp.oninput = e => { qs[i].w[+inp.dataset.k] = e.target.value; });
      row.querySelector('.rm').onclick = () => { qs.splice(i, 1); renderQs(); };
    });
  }
  document.addEventListener('egido:lang', renderQs);
  $('#blocks').onchange = renderQs;
  $('#btnAdd').onclick = () => { qs.push({ q: '', a: '', w: ['', '', ''] }); renderQs(); const rows = document.querySelectorAll('.qitem .q'); if (rows.length) rows[rows.length - 1].focus(); };
  $('#btnExample').onclick = () => writeConfig({ items: t('penguen.ex').split('|').map(s => { const p = s.split(';'); return { q: p[0], a: p[1], w: p.slice(2) }; }), blocks: 4, lives: 1, time: 0, order: 'fixed' });

  function readConfig() {
    const nw = nWrong();
    return { items: qs.map(it => ({ q: it.q.trim(), a: it.a.trim(), w: it.w.slice(0, nw).map(x => (x || '').trim()) })).filter(it => it.q || it.a || it.w.some(Boolean)),
      blocks: +$('#blocks').value, lives: +$('#lives').value, time: +$('#time').value, order: $('#order').value };
  }
  function writeConfig(c) {
    $('#blocks').value = c.blocks || 4; $('#lives').value = c.lives || 1; $('#time').value = c.time != null ? c.time : 0; $('#order').value = c.order || 'fixed';
    qs = (c.items || []).map(it => ({ q: it.q || '', a: it.a || '', w: [...(it.w || []), '', '', ''].slice(0, 3) }));
    renderQs();
  }
  function validate(c) {
    if (!Array.isArray(c.items) || !c.items.length) return t('penguen.errEmpty');
    const nw = (c.blocks || 4) - 1;
    for (let i = 0; i < c.items.length; i++) {
      const it = c.items[i];
      if (!it.q || !it.a || !Array.isArray(it.w) || it.w.length < nw || it.w.slice(0, nw).some(x => !x)) return t('penguen.errFields', { n: i + 1, w: nw });
      const low = it.w.map(x => x.toLocaleLowerCase());
      if (low.includes(it.a.toLocaleLowerCase()) || new Set(low).size !== low.length) return t('penguen.errDup', { n: i + 1 });
    }
    return '';
  }

  // ---------- Sahne ----------
  const canvas = $('#c'), ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1, TOP = 120;
  function resize() {
    if (!canvas.clientWidth || !canvas.clientHeight) return; // gizli/ölçüsüz tuvalle yerleşim yapma
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const qb = $('#hudQ').getBoundingClientRect(); TOP = Math.max(100, qb.bottom + 10);
    layout();
    // Boyut değişince (tablet döndürme, ilk kare) blokları ve pengueni yeniden yerleştir
    if (G.cfg && G.row.length) placeRow();
    if (G.cur) { G.cur.y = L.curY; G.cur.x = (G.cur.fx != null ? G.cur.fx : .5) * W; if (G.phase === 'idle') G.penguin = { x: G.cur.x, y: L.curY - L.bh / 2 }; }
  }
  window.addEventListener('resize', () => { if (G.running) resize(); });

  const G = { cfg: null, running: false, order: [], idx: 0, score: 0, correct: 0, wrong: 0, missed: [], t0: 0, lives: 1,
    phase: 'idle', pt: 0, cur: null, row: [], penguin: { x: 0, y: 0 }, jumpFrom: null, jumpTo: null, target: null, scrollDy: 0, waveT: 0, bubbles: [], timer: null, timeLeft: 0, sparkles: [],
    drops: [], ripples: [], shakeT: 0, flail: 0, under: 0 };
  const L = { curY: 0, rowY: 0, bw: 0, bh: 0, pz: 0 };
  function layout() {
    L.curY = H * .82; L.rowY = TOP + (H * .82 - TOP) * .38;
    const n = G.cfg ? G.cfg.blocks : 4;
    L.bw = clamp((W - 40) / n - 18, 90, 230); L.bh = L.bw * .32;
    L.pz = clamp(H * .11, 54, 96); // penguen boyu
  }
  const cur = () => G.cfg.items[G.order[G.idx]];

  function startGame(cfg) {
    G.cfg = cfg;
    Object.assign(G, { running: true, idx: 0, score: 0, correct: 0, wrong: 0, missed: [], t0: performance.now(), lives: cfg.lives || 1, phase: 'idle', pt: 0, scrollDy: 0, waveT: 0, bubbles: [], sparkles: [] });
    G.order = cfg.items.map((_, i) => i); if (cfg.order === 'random') G.order = shuffle(G.order);
    document.body.classList.add('playing');
    const p = Egido.player; $('#hudPlayer').textContent = '👤 ' + p.name + (p.cls ? ' · ' + p.cls : '');
    $('#hudTime').classList.toggle('hidden', !cfg.time);
    $('#hudLives').classList.toggle('hidden', (cfg.lives || 1) <= 1);
    resize();
    G.cur = { x: W / 2, fx: .5, y: L.curY, text: '', w: L.bw * 1.1 };
    G.penguin = { x: W / 2, y: L.curY - L.bh / 2 };
    setQuestion(); draw();
    Egido.countdown(3, () => { G.last = performance.now(); G.raf = requestAnimationFrame(loop); }, () => G.running);
  }
  function setQuestion() {
    const q = cur(), n = G.cfg.blocks;
    $('#hudQ').textContent = q.q;
    const answers = shuffle([{ text: q.a, ok: true }, ...q.w.slice(0, n - 1).map(x => ({ text: x, ok: false }))]);
    G.row = answers.map(a => ({ x: 0, y: 0, text: a.text, ok: a.ok, tilt: 0, sink: 0, bob: rand(0, 6.28) }));
    placeRow(); updateHud(); startTimer();
  }
  function placeRow() {
    const n = G.row.length, gap = (W - n * L.bw) / (n + 1);
    G.row.forEach((b, i) => { b.x = gap + L.bw / 2 + i * (L.bw + gap); b.y = L.rowY + (i % 2 ? 14 : -14); });
  }
  function updateHud() {
    $('#hudScore').textContent = '⭐ ' + G.score;
    $('#hudProg').textContent = `🐧 ${G.idx + 1}/${G.order.length}`;
    if ((G.cfg.lives || 1) > 1) $('#hudLives').textContent = '❤'.repeat(Math.max(0, G.lives)) + '🖤'.repeat(Math.max(0, G.cfg.lives - G.lives));
  }

  // ---------- Döngü ----------
  function loop(now) {
    if (!G.running) return;
    const dt = Math.min(.05, (now - G.last) / 1000); G.last = now;
    update(dt); if (!G.running) return;
    draw(); G.raf = requestAnimationFrame(loop);
  }
  function update(dt) {
    G.waveT += dt;
    if (G.phase === 'jump') {
      G.pt = Math.min(1, G.pt + dt / .7); const k = ease(G.pt);
      G.penguin.x = G.jumpFrom.x + (G.jumpTo.x - G.jumpFrom.x) * k;
      G.penguin.y = G.jumpFrom.y + (G.jumpTo.y - G.jumpFrom.y) * k - Math.sin(G.pt * Math.PI) * H * .18;
      if (G.pt >= 1) land();
    } else if (G.phase === 'scroll') {
      G.pt = Math.min(1, G.pt + dt / .7); const k = ease(G.pt), dy = (L.curY - G.target.y);
      G.scrollDy = dy * k;
      if (G.pt >= 1) finishScroll();
    } else if (G.phase === 'sink') {
      G.pt = Math.min(1, G.pt + dt / 2.0);
      const b = G.target, pt = G.pt;
      if (pt < .22) {                                   // 1) çatlaklar ilerler, hafif titreme
        b.crack = pt / .22; b.shiver = Math.sin(pt * 90) * 2;
        G.penguin.y = b.y - L.bh / 2 + b.shiver;
      } else {
        if (!b.broken) breakBlock(b);                   // 2) parçalanma anı: sıçrama, halka, ses, sarsıntı
        const k = (pt - .22) / .78;
        for (const sh of b.shards) { sh.rot += sh.vr * dt; sh.dy += (sh.vy + k * 160) * dt; sh.dx += sh.vx * dt; sh.alpha = Math.max(0, 1 - Math.max(0, k - .35) / .45); }
        // penguen: önce kanat çırpıp hafif zıplar, sonra suya gömülür
        G.flail = k < .35 ? Math.sin(k / .35 * Math.PI * 3) : 0;
        const hop = k < .3 ? Math.sin(k / .3 * Math.PI) * L.pz * .35 : 0;
        G.penguin.y = b.y - L.bh / 2 - hop + Math.max(0, k - .25) * L.pz * 2.4;
        G.under = clamp((k - .4) / .4, 0, 1);
        if (k > .3 && Math.random() < .6) G.bubbles.push({ x: G.penguin.x + rand(-18, 18), y: G.penguin.y - L.pz * .4, r: rand(2, 7), vy: rand(30, 80), life: 1 });
      }
      if (pt >= 1 && !G.sunk) { G.sunk = true; setTimeout(afterSink, 400); }
    }
    for (let i = G.drops.length - 1; i >= 0; i--) { const d = G.drops[i]; d.vy += 700 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.life -= dt; if (d.life <= 0) G.drops.splice(i, 1); }
    for (let i = G.ripples.length - 1; i >= 0; i--) { const r = G.ripples[i]; r.r += 90 * dt; r.life -= dt * .8; if (r.life <= 0) G.ripples.splice(i, 1); }
    if (G.shakeT > 0) G.shakeT -= dt;
    for (let i = G.bubbles.length - 1; i >= 0; i--) { const b = G.bubbles[i]; b.y -= b.vy * dt; b.life -= dt * .8; if (b.life <= 0) G.bubbles.splice(i, 1); }
    for (let i = G.sparkles.length - 1; i >= 0; i--) { const s = G.sparkles[i]; s.life -= dt; s.y -= 40 * dt; if (s.life <= 0) G.sparkles.splice(i, 1); }
  }

  // ---------- Zıplama / sonuç ----------
  function jumpTo(block) {
    if (G.phase !== 'idle') return;
    stopTimer();
    G.target = block; G.phase = 'jump'; G.pt = 0;
    G.jumpFrom = { x: G.penguin.x, y: G.penguin.y }; G.jumpTo = { x: block.x, y: block.y - L.bh / 2 };
    tone(520, .12, 'triangle', .15, 0, 880);
  }
  function land() {
    const b = G.target;
    if (b.ok) {
      const bonus = G.cfg.time ? Math.round(Math.max(0, G.timeLeft) / G.cfg.time * 5) : 0;
      G.score += 10 + bonus; G.correct++; updateHud(); sfx.good();
      for (let i = 0; i < 10; i++) G.sparkles.push({ x: b.x + rand(-L.bw / 2, L.bw / 2), y: b.y - rand(0, 40), life: rand(.5, 1) });
      G.row.forEach(x => { if (x !== b) x.fade = true; });
      G.phase = 'scroll'; G.pt = 0;
    } else {
      G.wrong++; G.missed.push(cur().q); G.lives--; updateHud();
      tone(1400, .12, 'square', .12, 0, 900); // ilk çıtırtı
      b.crack = 0; b.broken = false; b.shards = null;
      G.phase = 'sink'; G.pt = 0; G.sunk = false; G.flail = 0; G.under = 0;
      const fb = $('#flashBad'); fb.classList.add('on'); setTimeout(() => fb.classList.remove('on'), 50);
    }
  }
  // Bloğu iki çatlakla üç parçaya böl; parçalar ayrı ayrı yan yatıp batar
  function breakBlock(b) {
    b.broken = true; b.shiver = 0;
    const w = L.bw, h = L.bh;
    const zig = (x0, x1) => [[-h / 2, x0], [-h * .15, x0 + rand(-w * .07, w * .07)], [h * .2, x1 + rand(-w * .07, w * .07)], [h / 2, x1]].map(([y, x]) => ({ x, y }));
    const c1 = zig(-w * .18, -w * .1), c2 = zig(w * .22, w * .3);
    const left = [{ x: -w / 2, y: -h / 2 }, ...c1, { x: -w / 2, y: h / 2 }];
    const mid = [...c1, ...c2.slice().reverse()];
    const right = [...c2, { x: w / 2, y: h / 2 }, { x: w / 2, y: -h / 2 }];
    const mk = (poly, vr, vx, vy) => { const cx = poly.reduce((a, p) => a + p.x, 0) / poly.length, cy = poly.reduce((a, p) => a + p.y, 0) / poly.length;
      return { poly: poly.map(p => ({ x: p.x - cx, y: p.y - cy })), cx, cy, dx: 0, dy: 0, rot: 0, vr, vx, vy, alpha: 1 }; };
    b.shards = [mk(left, -1.1, -22, 40), mk(mid, .35, 0, 90), mk(right, 1.3, 26, 50)];
    const wy = b.y + h * .25; // su çizgisi
    for (let i = 0; i < 26; i++) { const a = rand(-Math.PI * .9, -Math.PI * .1); const sp = rand(120, 320); G.drops.push({ x: b.x + rand(-w / 2, w / 2), y: wy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rand(2, 5), life: rand(.5, 1) }); }
    G.ripples.push({ x: b.x, y: wy, r: w * .3, life: 1 }, { x: b.x, y: wy, r: w * .15, life: 1.3 });
    G.shakeT = .45;
    tone(90, .35, 'square', .3, 0, 40); tone(600, .08, 'sawtooth', .2, .02, 200); sfx.bad();
  }
  function finishScroll() {
    // hedef blok yeni "mevcut" blok olur, sahne sıfırlanır
    G.scrollDy = 0;
    G.cur = { x: G.target.x, fx: G.target.x / W, y: L.curY, text: '', w: L.bw };
    G.penguin = { x: G.target.x, y: L.curY - L.bh / 2 };
    G.idx++;
    if (G.idx >= G.order.length) return endGame('win');
    G.phase = 'idle'; setQuestion();
  }
  function afterSink() {
    if (!G.running) return;
    if (G.lives > 0) { // can varsa aynı soruyla penguen geri döner
      G.phase = 'idle'; G.penguin = { x: G.cur.x, y: L.curY - L.bh / 2 }; G.target.gone = true; G.bubbles = []; G.drops = []; G.ripples = []; G.flail = 0; G.under = 0;
      startTimer(); return;
    }
    endGame('lose');
  }

  // ---------- Çizim ----------
  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function drawWater() {
    ctx.save();
    for (let i = 0; i < 6; i++) {
      const y = TOP + 20 + (H - TOP) * i / 6 + Math.sin(G.waveT * 1.5 + i) * 6;
      ctx.strokeStyle = `rgba(255,255,255,${.07 + i * .015})`; ctx.lineWidth = 2; ctx.beginPath();
      for (let x = 0; x <= W; x += 20) ctx.lineTo(x, y + Math.sin(x / 60 + G.waveT * 2 + i) * 5);
      ctx.stroke();
    }
    ctx.restore();
  }
  function drawBlock(b, isCur) {
    const bob = isCur ? 0 : Math.sin(G.waveT * 1.6 + (b.bob || 0)) * 3;
    const w = isCur ? L.bw * 1.1 : L.bw, h = L.bh, x = b.x, y = b.y + (b.sink || 0) + bob + (isCur ? 0 : G.scrollDy);
    if (b.gone) return;
    if (b.broken) { drawShards(b); return; }
    ctx.save(); ctx.translate(x + (b.shiver || 0), y);
    if (b.fade && G.phase === 'scroll') ctx.globalAlpha = 1 - G.pt;
    // su altı gölgesi
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0, h * .55, w * .55, h * .35, 0, 0, Math.PI * 2); ctx.fill();
    // buz: üst yüzey + yan
    ctx.fillStyle = '#8fd3f4'; roundRect(-w / 2, -h / 2 + h * .35, w, h * .65, 10); ctx.fill();
    const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#cfefff');
    ctx.fillStyle = g; roundRect(-w / 2, -h / 2, w, h * .7, 12); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2; roundRect(-w / 2, -h / 2, w, h * .7, 12); ctx.stroke();
    if (b.crack > 0 && !b.broken) { // ilerleyen çatlaklar
      ctx.strokeStyle = '#3d86b4'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      const segs = [[-w * .18, -h / 2, -w * .12, -h * .15], [-w * .12, -h * .15, -w * .2, h * .2], [-w * .2, h * .2, -w * .1, h / 2], [w * .22, -h / 2, w * .3, -h * .1], [w * .3, -h * .1, w * .2, h * .25], [w * .2, h * .25, w * .3, h / 2], [-w * .12, -h * .15, w * .02, -h * .3]];
      const n = Math.floor(b.crack * segs.length), frac = b.crack * segs.length - n;
      ctx.beginPath();
      segs.forEach((sg, i) => { if (i < n) { ctx.moveTo(sg[0], sg[1]); ctx.lineTo(sg[2], sg[3]); } else if (i === n) { ctx.moveTo(sg[0], sg[1]); ctx.lineTo(sg[0] + (sg[2] - sg[0]) * frac, sg[1] + (sg[3] - sg[1]) * frac); } });
      ctx.stroke();
    }
    if (b.text) { ctx.fillStyle = '#0b3d5c'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; fitText(b.text, 0, -h / 2 + h * .35, w - 20, Math.round(h * .5)); }
    ctx.restore();
  }
  function drawShards(b) {
    const h = L.bh;
    for (const sh of b.shards) {
      if (sh.alpha <= 0) continue;
      ctx.save(); ctx.globalAlpha = sh.alpha; ctx.translate(b.x + sh.cx + sh.dx, b.y + sh.cy + sh.dy); ctx.rotate(sh.rot);
      ctx.beginPath(); sh.poly.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath();
      const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2); g.addColorStop(0, '#ffffff'); g.addColorStop(.6, '#cfefff'); g.addColorStop(1, '#8fd3f4');
      ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    }
  }
  function fitText(text, x, y, maxW, size) {
    ctx.font = `800 ${size}px "Segoe UI", system-ui, sans-serif`;
    while (ctx.measureText(text).width > maxW && size > 11) { size--; ctx.font = `800 ${size}px "Segoe UI", system-ui, sans-serif`; }
    ctx.fillText(text, x, y);
  }
  function drawPenguin(px, py) {
    const s = L.pz, squash = G.phase === 'jump' ? 1 - Math.sin(G.pt * Math.PI) * .12 : 1;
    ctx.save(); ctx.translate(px, py); ctx.scale(1 / squash, squash);
    if (G.under > 0) { ctx.globalAlpha = 1 - G.under * .85; ctx.rotate(G.under * .5); } // suya gömülürken yan yatar ve silikleşir
    const wingUp = G.flail ? Math.abs(G.flail) * 1.2 : 0; // kanatlar yukarı çırpar
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(0, 2, s * .32, s * .08, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff9f1c'; ctx.beginPath(); ctx.ellipse(-s * .14, -s * .02, s * .13, s * .06, -.3, 0, Math.PI * 2); ctx.ellipse(s * .14, -s * .02, s * .13, s * .06, .3, 0, Math.PI * 2); ctx.fill(); // ayaklar
    ctx.fillStyle = '#1b2631'; ctx.beginPath(); ctx.ellipse(0, -s * .45, s * .3, s * .42, 0, 0, Math.PI * 2); ctx.fill();   // gövde
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(0, -s * .38, s * .2, s * .3, 0, 0, Math.PI * 2); ctx.fill();         // karın
    ctx.fillStyle = '#1b2631'; ctx.beginPath(); ctx.ellipse(-s * .3, -s * .45 - wingUp * s * .15, s * .07, s * .22, .5 + wingUp, 0, Math.PI * 2); ctx.ellipse(s * .3, -s * .45 - wingUp * s * .15, s * .07, s * .22, -.5 - wingUp, 0, Math.PI * 2); ctx.fill(); // kanatlar
    ctx.beginPath(); ctx.arc(0, -s * .82, s * .2, 0, Math.PI * 2); ctx.fill();                                               // kafa
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-s * .07, -s * .85, s * .055, 0, Math.PI * 2); ctx.arc(s * .07, -s * .85, s * .055, 0, Math.PI * 2); ctx.fill(); // gözler
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-s * .06, -s * .85, s * .025, 0, Math.PI * 2); ctx.arc(s * .08, -s * .85, s * .025, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff9f1c'; ctx.beginPath(); ctx.moveTo(-s * .06, -s * .77); ctx.lineTo(s * .06, -s * .77); ctx.lineTo(0, -s * .68); ctx.closePath(); ctx.fill(); // gaga
    ctx.restore();
  }
  function draw() {
    if (canvas.clientWidth !== W || canvas.clientHeight !== H) resize(); // ilk kare / döndürme
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (G.shakeT > 0) ctx.translate(rand(-7, 7) * G.shakeT, rand(-7, 7) * G.shakeT);
    drawWater();
    for (const r of G.ripples) { ctx.save(); ctx.globalAlpha = Math.max(0, r.life) * .7; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, r.r * .35, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
    for (const b of G.row) drawBlock(b, false);
    if (G.phase !== 'scroll' || G.pt < 1) { const c = Object.assign({}, G.cur, { y: G.cur.y + G.scrollDy }); if (G.phase === 'scroll') c.fade = true; drawBlock(c, true); }
    for (const s of G.sparkles) { ctx.save(); ctx.globalAlpha = Math.max(0, s.life); ctx.fillStyle = '#fff'; ctx.font = '20px serif'; ctx.textAlign = 'center'; ctx.fillText('✦', s.x, s.y + G.scrollDy); ctx.restore(); }
    const py = G.phase === 'scroll' ? G.penguin.y + G.scrollDy : G.penguin.y;
    if (!(G.phase === 'sink' && G.under >= 1)) drawPenguin(G.penguin.x, py);
    for (const b of G.bubbles) { ctx.save(); ctx.globalAlpha = Math.max(0, b.life); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
    for (const d of G.drops) { ctx.save(); ctx.globalAlpha = Math.max(0, d.life); ctx.fillStyle = '#cfefff'; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
    ctx.restore();
  }

  // ---------- Etkileşim ----------
  canvas.addEventListener('pointerdown', e => {
    if (!G.running || G.phase !== 'idle') return;
    const r = canvas.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    const b = G.row.find(x => !x.gone && Math.abs(px - x.x) <= L.bw / 2 + 8 && Math.abs(py - x.y) <= L.bh / 2 + 16);
    if (b) jumpTo(b);
  });
  function startTimer() {
    stopTimer(); if (!G.cfg.time) return;
    G.timeLeft = G.cfg.time; $('#hudTime').textContent = '⏱ ' + G.timeLeft; $('#hudTime').style.color = '';
    let last = performance.now();
    G.timer = setInterval(() => {
      const now = performance.now(); G.timeLeft -= (now - last) / 1000; last = now;
      const s = Math.max(0, Math.ceil(G.timeLeft)); $('#hudTime').textContent = '⏱ ' + s; $('#hudTime').style.color = s <= 5 ? '#ffd1cc' : '';
      if (G.timeLeft <= 0 && G.phase === 'idle') { stopTimer(); const wrongBlock = G.row.find(x => !x.ok && !x.gone) || G.row[0]; jumpTo(wrongBlock); } // süre dolunca yanlışa düşer
    }, 100);
  }
  function stopTimer() { if (G.timer) { clearInterval(G.timer); G.timer = null; } }
  $('#btnQuit').onclick = async () => { if (G.running && await EgidoUI.confirm(t('puzzle.quitConfirm'))) endGame('quit'); };
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.running) stopTimer(); });

  function endGame(kind) {
    G.running = false; stopTimer(); cancelAnimationFrame(G.raf);
    document.body.classList.remove('playing');
    const total = G.order.length, time = (performance.now() - G.t0) / 1000;
    if (kind === 'lose') for (let i = G.idx + 1; i < total; i++) G.missed.push(G.cfg.items[G.order[i]].q); // geçilemeyen sorular
    const r = { kind, score: G.score, correct: G.correct, total, wrong: G.wrong, time, missed: [...new Set(G.missed)], missedTitle: t('penguen.missed') };
    if (kind === 'win') { r.emoji = G.wrong === 0 ? '🏆' : '🐧'; r.title = G.wrong === 0 ? t('penguen.perfect') : t('res.won'); r.msg = G.wrong === 0 ? t('penguen.perfectMsg') : t('penguen.overMsg', { t: total, c: G.correct }); sfx.win(); }
    else if (kind === 'lose') { r.emoji = '🌊'; r.title = t('penguen.splash'); r.msg = t('penguen.overMsg', { t: total, c: G.correct }); sfx.lose(); }
    else { r.emoji = '🚪'; }
    Egido.finish(r);
  }

  renderQs();
  Egido.init({
    gameId: 'penguen', emoji: '🐧',
    introRules: () => t('penguen.rules'),
    readConfig, writeConfig, validate,
    summary: c => t('penguen.summary', { n: (c.items || []).length }),
    startGame,
  });
})();
</script>
</body>
</html>
