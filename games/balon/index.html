<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Balon Patlat – Egido</title>
<link rel="stylesheet" href="../../shared/egido.css">
<style>
  .ta-ok { border-color: #bfe9cf; } .ta-ok:focus { border-color: var(--ok); }
  .ta-bad { border-color: #f5c6c1; } .ta-bad:focus { border-color: var(--bad); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .hud .lives { letter-spacing: 2px; font-size: 18px; }
  /* Soru şeridi: HUD'un altında, tam genişlik, satır kaydırır; tablette de okunur */
  .qbar { position: absolute; top: 58px; left: 0; right: 0; padding: 6px 18px; text-align: center; pointer-events: none; z-index: 2; }
  .qbar div { display: inline-block; max-width: min(1100px, 96%); background: rgba(0,0,0,.32); backdrop-filter: blur(4px); color: #fff;
    border-radius: 16px; padding: 10px 22px; font-weight: 800; font-size: clamp(20px, 3.2vw, 34px); line-height: 1.25; text-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .flashBad { position: fixed; inset: 0; pointer-events: none; z-index: 3; box-shadow: inset 0 0 140px rgba(231,76,60,0); transition: box-shadow .35s; }
  .flashBad.on { box-shadow: inset 0 0 140px rgba(231,76,60,.75); transition: none; }
</style>
</head>
<body>

<!-- ===================== ÖĞRETMEN KURULUM ===================== -->
<div id="setup" class="screen">
  <div class="card">
    <div id="teacherBarHost"></div>
    <h1>🎈 Balon <span>Patlat</span></h1>
    <p class="sub">Soruyu ve cevapları yazın. Doğru cevaplı balonlar patlatılır, yanlışlara dokunulmaz.</p>

    <label for="question">Soru / Yönerge <small>(oyun ekranının üstünde büyük görünür)</small></label>
    <input type="text" id="question" placeholder="Örn: Aşağıdakilerden hangileri memeli hayvandır?" maxlength="160">

    <div class="cols">
      <div>
        <label for="correct">✅ Doğru cevaplar <small>(her satıra bir tane)</small></label>
        <textarea id="correct" class="ta-ok" placeholder="Balina&#10;Yarasa&#10;Fil"></textarea>
      </div>
      <div>
        <label for="wrong">❌ Yanlış cevaplar <small>(her satıra bir tane)</small></label>
        <textarea id="wrong" class="ta-bad" placeholder="Köpekbalığı&#10;Penguen&#10;Timsah&#10;Kertenkele"></textarea>
      </div>
    </div>

    <div class="cols three">
      <div>
        <label for="speed">Hız</label>
        <select id="speed"><option value="1">Yavaş</option><option value="2" selected>Normal</option><option value="3">Hızlı</option><option value="4">Çok hızlı</option></select>
      </div>
      <div>
        <label for="lives">Can hakkı</label>
        <select id="lives"><option value="1">1</option><option value="3" selected>3</option><option value="5">5</option><option value="0">Sınırsız</option></select>
      </div>
      <div>
        <label for="duration">Süre</label>
        <select id="duration"><option value="0">Süresiz</option><option value="30">30 saniye</option><option value="60" selected>60 saniye</option><option value="90">90 saniye</option><option value="120">2 dakika</option></select>
      </div>
    </div>
    <p class="hint">Kazanmak için tüm doğru balonların patlatılması gerekir. Yanlış balon patlatınca bir can gider.</p>

    <div class="err" id="setupErr"></div>
    <div class="row">
      <button class="btn" id="btnStart">▶ Oyunu Dene</button>
      <button class="btn" id="btnShare">🎟 Öğrenci Kodu Oluştur</button>
      <button class="btn secondary" id="btnLbSetup">🏆 Skor Tablosu</button>
      <button class="btn secondary" id="btnExample">Örnek doldur</button>
    </div>
    <div id="sharePanelHost"></div>
  </div>
</div>

<!-- ===================== OYUN ===================== -->
<div id="game" class="screen hidden">
  <div class="hud">
    <div class="pill" id="hudPlayer">👤</div>
    <div class="pill progress" id="hudScore">⭐ 0</div>
    <div class="q"></div>
    <div class="pill progress" id="hudLeft">🎯 0/0</div>
    <div class="pill lives" id="hudLives">❤❤❤</div>
    <div class="pill progress" id="hudTime">⏱ 60</div>
    <div class="pill pauseBtn" id="btnPause" title="Duraklat">⏸</div>
  </div>
  <div class="qbar"><div id="hudQ"></div></div>
  <canvas id="c"></canvas>
  <div class="flashBad" id="flashBad"></div>
  <div id="countdown" class="hidden"></div>
  <div id="pauseOverlay" class="hidden">
    <div class="card" style="width:auto;text-align:center">
      <h2 style="margin-top:0">Duraklatıldı</h2>
      <div class="row" style="justify-content:center">
        <button class="btn" id="btnResume">▶ Devam</button>
        <button class="btn secondary" id="btnQuit">Çıkış</button>
      </div>
    </div>
  </div>
</div>

<script src="../../shared/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../../shared/egido.js"></script>
<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const { sfx, tone } = Egido;

  // ---------- Ayarlar ----------
  const parseLines = t => [...new Set(t.split('\n').map(s => s.trim()).filter(Boolean))];
  function readConfig() {
    return { q: $('#question').value.trim(), correct: parseLines($('#correct').value), wrong: parseLines($('#wrong').value),
      speed: +$('#speed').value, lives: +$('#lives').value, duration: +$('#duration').value };
  }
  function writeConfig(c) {
    $('#question').value = c.q || '';
    $('#correct').value = (c.correct || []).join('\n');
    $('#wrong').value = (c.wrong || []).join('\n');
    $('#speed').value = c.speed != null ? c.speed : 2;
    $('#lives').value = c.lives != null ? c.lives : 3;
    $('#duration').value = c.duration != null ? c.duration : 60;
  }
  function validate(c) {
    if (!Array.isArray(c.correct) || !c.correct.length) return 'En az bir doğru cevap yazmalısınız.';
    if (!Array.isArray(c.wrong) || !c.wrong.length) return 'En az bir yanlış cevap yazmalısınız.';
    const lowWrong = c.wrong.map(w => w.toLocaleLowerCase('tr'));
    const dup = c.correct.filter(x => lowWrong.includes(x.toLocaleLowerCase('tr')));
    if (dup.length) return 'Hem doğru hem yanlış listesinde olan cevap var: ' + dup.join(', ');
    return '';
  }
  $('#btnExample').onclick = () => writeConfig({
    q: 'Hangileri memeli hayvandır?',
    correct: ['Balina', 'Yarasa', 'Fil', 'Yunus', 'Kanguru'],
    wrong: ['Köpekbalığı', 'Penguen', 'Timsah', 'Kertenkele', 'Kartal', 'Kurbağa', 'Ahtapot'],
    speed: 2, lives: 3, duration: 60,
  });

  // ---------- Oyun durumu ----------
  const canvas = $('#c'), ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1, TOP = 120; // TOP: HUD + soru şeridinin kapladığı yükseklik
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const qb = $('#hudQ').getBoundingClientRect(); TOP = Math.max(100, qb.bottom + 10);
  }
  window.addEventListener('resize', () => { if (G.running) resize(); });

  const PALETTE = [
    ['#ff6b6b', '#c0392b'], ['#ffa94d', '#d35400'], ['#ffd43b', '#e0a800'], ['#69db7c', '#2b8a3e'],
    ['#4dabf7', '#1864ab'], ['#9775fa', '#5f3dc4'], ['#f783ac', '#a61e4d'], ['#63e6be', '#099268'],
  ];
  const G = { cfg: null, running: false, paused: false, balloons: [], particles: [], floaters: [], score: 0, lives: 3,
    remaining: new Set(), onScreen: new Set(), popsGood: 0, popsBad: 0, combo: 0, elapsed: 0, timeLeft: 0, spawnT: 0, last: 0, raf: 0, shakeT: 0, nextColor: 0 };

  // Metnin balona sığacak şekilde yazı boyutu / satır bölme
  function layoutText(text) {
    ctx.save();
    let size = 18, lines = [text];
    const maxW = 110;
    const fit = () => { ctx.font = `700 ${size}px "Segoe UI", system-ui, sans-serif`; return Math.max(...lines.map(l => ctx.measureText(l).width)); };
    let w = fit();
    while (w > maxW && size > 12) { size -= 1; w = fit(); }
    if (w > maxW && text.includes(' ')) {
      const words = text.split(' '); let best = null;
      for (let i = 1; i < words.length; i++) {
        lines = [words.slice(0, i).join(' '), words.slice(i).join(' ')]; size = 16; w = fit();
        while (w > maxW && size > 11) { size -= 1; w = fit(); }
        if (!best || w < best.w) best = { lines: lines.slice(), size, w };
      }
      lines = best.lines; size = best.size; w = best.w;
    }
    ctx.restore();
    const rx = clamp(w / 2 + 22, 46, 95);
    return { lines, size, rx, ry: rx * 1.18 };
  }
  function makeBalloon(text, isCorrect) {
    const t = layoutText(text);
    const color = PALETTE[G.nextColor++ % PALETTE.length];
    const base = [55, 85, 120, 160][G.cfg.speed - 1];
    const b = { text, isCorrect, lines: t.lines, size: t.size, rx: t.rx, ry: t.ry, color, x: 0, y: H + t.ry + 20, vy: base * rand(.85, 1.2),
      phase: rand(0, Math.PI * 2), swayAmp: rand(10, 28), swaySpeed: rand(1.2, 2.2), rot: 0 };
    for (let tries = 0; tries < 10; tries++) {
      b.x = rand(b.rx + 10, Math.max(b.rx + 11, W - b.rx - 10));
      if (!G.balloons.some(o => o.y > H - 260 && Math.abs(o.x - b.x) < o.rx + b.rx + 8)) break;
    }
    return b;
  }
  function spawn() {
    const maxOnScreen = clamp(Math.round(W / 150), 4, 9);
    if (G.balloons.length >= maxOnScreen) return;
    const availCorrect = [...G.remaining].filter(a => !G.onScreen.has(a));
    const availWrong = G.cfg.wrong.filter(a => !G.onScreen.has(a));
    const pCorrect = G.remaining.size <= 2 ? .6 : .45;
    let text, isCorrect;
    if (availCorrect.length && (Math.random() < pCorrect || !availWrong.length)) { text = pick(availCorrect); isCorrect = true; }
    else if (availWrong.length) { text = pick(availWrong); isCorrect = false; }
    else if (availCorrect.length) { text = pick(availCorrect); isCorrect = true; }
    else return;
    G.onScreen.add(text);
    G.balloons.push(makeBalloon(text, isCorrect));
  }

  function startGame(cfg) {
    G.cfg = cfg;
    Object.assign(G, { running: true, paused: false, balloons: [], particles: [], floaters: [], score: 0, lives: cfg.lives || Infinity,
      remaining: new Set(cfg.correct), onScreen: new Set(), popsGood: 0, popsBad: 0, combo: 0, elapsed: 0, timeLeft: cfg.duration || Infinity,
      spawnT: 0, shakeT: 0, nextColor: Math.floor(Math.random() * PALETTE.length) });
    $('#hudQ').textContent = cfg.q || 'Doğru balonları patlat!';
    const p = Egido.player; $('#hudPlayer').textContent = '👤 ' + p.name + (p.cls ? ' · ' + p.cls : '');
    $('#hudTime').classList.toggle('hidden', !cfg.duration);
    $('#hudLives').classList.toggle('hidden', !cfg.lives);
    $('#pauseOverlay').classList.add('hidden');
    resize(); updateHud(); draw();
    Egido.countdown(3, () => { G.last = performance.now(); G.raf = requestAnimationFrame(loop); }, () => G.running);
  }
  function updateHud() {
    $('#hudScore').textContent = '⭐ ' + G.score;
    $('#hudLeft').textContent = `🎯 ${G.cfg.correct.length - G.remaining.size}/${G.cfg.correct.length}`;
    if (G.cfg.lives) $('#hudLives').textContent = '❤'.repeat(Math.max(0, G.lives)) + '🖤'.repeat(Math.max(0, G.cfg.lives - G.lives));
    if (G.cfg.duration) { const s = Math.max(0, Math.ceil(G.timeLeft)); $('#hudTime').textContent = '⏱ ' + s; $('#hudTime').style.color = s <= 10 ? '#ffd1cc' : ''; }
  }

  // ---------- Döngü ----------
  function loop(now) {
    if (!G.running) return;
    const dt = Math.min(.05, (now - G.last) / 1000); G.last = now;
    if (!G.paused) update(dt);
    if (!G.running) return;
    draw();
    G.raf = requestAnimationFrame(loop);
  }
  function update(dt) {
    G.elapsed += dt;
    if (G.cfg.duration) {
      const before = Math.ceil(G.timeLeft); G.timeLeft -= dt;
      if (Math.ceil(G.timeLeft) !== before && G.timeLeft <= 10 && G.timeLeft > 0) sfx.tick();
      if (G.timeLeft <= 0) { G.timeLeft = 0; updateHud(); return endGame(G.remaining.size === 0 ? 'win' : 'timeout'); }
      updateHud();
    }
    const interval = [1.6, 1.25, .95, .75][G.cfg.speed - 1];
    G.spawnT -= dt;
    if (G.spawnT <= 0) { spawn(); G.spawnT = interval * rand(.7, 1.2); }
    for (let i = G.balloons.length - 1; i >= 0; i--) {
      const b = G.balloons[i];
      b.y -= b.vy * dt; b.phase += b.swaySpeed * dt; b.rot = Math.sin(b.phase) * .08;
      if (b.y + b.ry + 60 < 0) { G.balloons.splice(i, 1); G.onScreen.delete(b.text); }
    }
    for (let i = G.particles.length - 1; i >= 0; i--) {
      const p = G.particles[i]; p.life -= dt;
      if (p.life <= 0) { G.particles.splice(i, 1); continue; }
      p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    }
    for (let i = G.floaters.length - 1; i >= 0; i--) { const f = G.floaters[i]; f.life -= dt; f.y -= 60 * dt; if (f.life <= 0) G.floaters.splice(i, 1); }
    if (G.shakeT > 0) G.shakeT -= dt;
  }

  // ---------- Çizim ----------
  function drawBalloon(b) {
    ctx.save();
    ctx.translate(b.x + Math.sin(b.phase) * b.swayAmp, b.y); ctx.rotate(b.rot);
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(0, b.ry + 10); ctx.bezierCurveTo(8, b.ry + 35, -8, b.ry + 55, 4, b.ry + 85); ctx.stroke();
    ctx.fillStyle = b.color[1]; ctx.beginPath(); ctx.moveTo(0, b.ry - 2); ctx.lineTo(-7, b.ry + 12); ctx.lineTo(7, b.ry + 12); ctx.closePath(); ctx.fill();
    const g = ctx.createRadialGradient(-b.rx * .35, -b.ry * .4, b.rx * .1, 0, 0, b.ry);
    g.addColorStop(0, '#ffffff'); g.addColorStop(.12, b.color[0]); g.addColorStop(1, b.color[1]);
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, b.rx, b.ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(-b.rx * .4, -b.ry * .45, b.rx * .18, b.ry * .28, -.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `700 ${b.size}px "Segoe UI", system-ui, sans-serif`;
    ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 1;
    const lh = b.size * 1.15, y0 = -(b.lines.length - 1) * lh / 2;
    b.lines.forEach((l, i) => ctx.fillText(l, 0, y0 + i * lh));
    ctx.restore();
  }
  function drawClouds() {
    ctx.save(); ctx.fillStyle = 'rgba(255,255,255,.08)';
    const t = G.elapsed * 12;
    for (let i = 0; i < 5; i++) {
      const x = ((i * 337 + t) % (W + 300)) - 150, y = TOP + 40 + (i * 97) % Math.max(100, (H - TOP) * .6);
      ctx.beginPath(); ctx.ellipse(x, y, 90, 30, 0, 0, Math.PI * 2); ctx.ellipse(x + 50, y - 15, 60, 35, 0, 0, Math.PI * 2); ctx.ellipse(x - 50, y - 5, 55, 28, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (G.shakeT > 0) ctx.translate(rand(-6, 6), rand(-6, 6));
    drawClouds();
    for (const b of G.balloons) drawBalloon(b);
    for (const p of G.particles) { ctx.save(); ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); ctx.restore(); }
    for (const f of G.floaters) { ctx.save(); ctx.globalAlpha = clamp(f.life / .9, 0, 1); ctx.fillStyle = f.color; ctx.font = `900 ${f.size}px "Segoe UI", system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 8; ctx.fillText(f.text, f.x, f.y); ctx.restore(); }
    ctx.restore();
  }

  // ---------- Etkileşim ----------
  function hit(px, py) {
    for (let i = G.balloons.length - 1; i >= 0; i--) {
      const b = G.balloons[i], cx = b.x + Math.sin(b.phase) * b.swayAmp;
      const dx = (px - cx) / (b.rx + 6), dy = (py - b.y) / (b.ry + 6);
      if (dx * dx + dy * dy <= 1) return i;
    }
    return -1;
  }
  function burst(x, y, color, n = 18) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(120, 420), life = rand(.4, .9);
      G.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, life, max: life, s: rand(6, 14), rot: rand(0, 6), vr: rand(-8, 8), color: Math.random() < .5 ? color[0] : color[1] });
    }
  }
  const floater = (text, x, y, color, size = 30) => G.floaters.push({ text, x, y, color, size, life: .9 });
  function pop(i) {
    const b = G.balloons.splice(i, 1)[0];
    G.onScreen.delete(b.text);
    const cx = b.x + Math.sin(b.phase) * b.swayAmp;
    burst(cx, b.y, b.color);
    if (b.isCorrect) {
      G.combo++; const bonus = Math.min(G.combo - 1, 5) * 2; const pts = 10 + bonus;
      G.score += pts; G.popsGood++; G.remaining.delete(b.text);
      floater('+' + pts + (bonus ? ' 🔥' : ''), cx, b.y - 20, '#b9ffcb', bonus ? 36 : 30);
      sfx.good();
      if (G.remaining.size === 0) { updateHud(); return endGame('win'); }
    } else {
      G.combo = 0; G.popsBad++; G.score = Math.max(0, G.score - 5);
      if (G.cfg.lives) G.lives--;
      floater('Yanlış!', cx, b.y - 20, '#ffb3ab', 34);
      sfx.bad(); G.shakeT = .3;
      const fb = $('#flashBad'); fb.classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => fb.classList.remove('on')));
      if (G.cfg.lives && G.lives <= 0) { updateHud(); return endGame('lose'); }
    }
    updateHud();
  }
  canvas.addEventListener('pointerdown', e => {
    if (!G.running || G.paused) return;
    const r = canvas.getBoundingClientRect(), i = hit(e.clientX - r.left, e.clientY - r.top);
    if (i >= 0) pop(i);
  });
  function setPaused(p) { if (!G.running) return; G.paused = p; $('#pauseOverlay').classList.toggle('hidden', !p); if (!p) G.last = performance.now(); }
  $('#btnPause').onclick = () => setPaused(true);
  $('#btnResume').onclick = () => setPaused(false);
  $('#btnQuit').onclick = () => { setPaused(false); endGame('quit'); };
  document.addEventListener('keydown', e => { if (G.running && (e.key === 'Escape' || e.key === 'p' || e.key === 'P')) setPaused(!G.paused); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.running) setPaused(true); });

  // ---------- Bitiş ----------
  function endGame(kind) {
    G.running = false; cancelAnimationFrame(G.raf);
    $('#pauseOverlay').classList.add('hidden');
    const total = G.cfg.correct.length, got = total - G.remaining.size;
    const r = { kind, score: G.score, correct: got, total, wrong: G.popsBad, time: G.elapsed, missed: [...G.remaining], missedTitle: 'Patlatılmayan doğru cevaplar:' };
    if (kind === 'win') { r.emoji = G.popsBad === 0 ? '🏆' : '🎉'; r.title = G.popsBad === 0 ? 'Mükemmel!' : 'Tebrikler!'; r.msg = G.popsBad === 0 ? 'Tüm doğru balonları hiç hata yapmadan patlattın.' : `Tüm doğru balonları patlattın, ${G.popsBad} yanlış patlatma oldu.`; sfx.win(); }
    else if (kind === 'lose') { r.emoji = '💥'; r.title = 'Canların bitti'; r.msg = `${total} doğru cevaptan ${got} tanesini bulabildin. Tekrar dene!`; sfx.lose(); }
    else if (kind === 'timeout') { r.emoji = '⏰'; r.title = 'Süre doldu'; r.msg = `${total} doğru cevaptan ${got} tanesini patlattın.`; sfx.lose(); }
    else { r.emoji = '🚪'; r.title = 'Oyundan çıkıldı'; }
    Egido.finish(r);
  }

  Egido.init({
    gameId: 'balon', gameName: 'Balon Patlat', emoji: '🎈',
    introRules: 'Doğru cevap yazan balonları patlat: <b class="ok">+10 puan</b>. Yanlış olanlara dokunursan <b class="bad">bir can</b> gider.',
    readConfig, writeConfig, validate,
    summary: c => c.q || 'Doğru balonları patlat!',
    startGame,
  });
})();
</script>
</body>
</html>
