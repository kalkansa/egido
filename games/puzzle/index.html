<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Harf Puzzle – Egido</title>
<link rel="stylesheet" href="../../shared/egido.css">
<style>
  /* ---------- Öğretmen: soru listesi ---------- */
  .items { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  .item { display: grid; grid-template-columns: 72px 1fr 1fr auto; gap: 10px; align-items: center; background: #f1f5fb; border-radius: 12px; padding: 10px; }
  @media (max-width: 640px) { .item { grid-template-columns: 72px 1fr; } .item .word { grid-column: 2; } .item .rm { grid-column: 1 / -1; justify-self: end; } }
  .thumb { width: 72px; height: 72px; border-radius: 10px; background: #fff; border: 2px dashed #c9d3e3; display: flex; align-items: center; justify-content: center; font-size: 40px; overflow: hidden; cursor: pointer; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb.empty { font-size: 22px; color: #9aa8bd; }
  .item input { margin: 0; }
  .item .imgsrc { font-size: 13px; }
  .item .rm { background: none; border: 0; color: var(--bad); font-size: 20px; cursor: pointer; padding: 6px 8px; }
  .addrow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }

  /* ---------- Oyun ---------- */
  .pz { position: absolute; inset: 0; padding-top: 64px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 14px; }
  .pz-img { height: min(34vh, 300px); width: min(92vw, 560px); display: flex; align-items: center; justify-content: center; }
  .pz-img img { max-height: 100%; max-width: 100%; border-radius: 16px; box-shadow: 0 15px 40px rgba(0,0,0,.35); background: #fff; }
  .pz-img .emo { font-size: min(26vh, 190px); line-height: 1; filter: drop-shadow(0 10px 20px rgba(0,0,0,.3)); }
  .pz-img .none { color: #fff; font-size: 24px; opacity: .8; }
  .slots, .tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 96vw; }
  .slot { width: var(--tz); height: var(--tz); border-radius: 10px; border: 3px dashed rgba(255,255,255,.55); display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--tz) * .55); font-weight: 900; color: #fff; background: rgba(0,0,0,.18); cursor: pointer; transition: transform .1s; }
  .slot.gap { border: 0; background: none; width: calc(var(--tz) * .5); cursor: default; }
  .slot.filled { border-style: solid; border-color: #fff; background: #fff; color: var(--ink); }
  .slot.locked { background: #ffe9c2; border-color: #ffbf69; cursor: default; }
  .slot.ok { background: #bff3cf; border-color: var(--ok); }
  .slot.bad { background: #ffd0cb; border-color: var(--bad); }
  .slots.shake { animation: shake .35s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  .tiles { min-height: calc(var(--tz) + 16px); padding: 6px 0; }
  .tile { position: relative; width: var(--tz); height: var(--tz); border-radius: 12px; background: linear-gradient(180deg, #ffe08a, #ffb703); color: #4a2d00;
    display: flex; align-items: center; justify-content: center; font-size: calc(var(--tz) * .58); font-weight: 900; cursor: pointer; user-select: none;
    box-shadow: 0 5px 0 #c77d00, 0 8px 16px rgba(0,0,0,.25); transition: transform .12s, opacity .15s; transform: rotate(var(--rot)); }
  .tile::before { content: ''; position: absolute; top: -9px; left: 50%; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #ffd25e; } /* puzzle çıkıntısı */
  .tile::after { content: ''; position: absolute; bottom: -1px; left: 50%; width: 16px; height: 9px; margin-left: -8px; border-radius: 8px 8px 0 0; background: rgba(0,0,0,.18); } /* puzzle girintisi */
  .tile:active { transform: rotate(var(--rot)) translateY(3px); box-shadow: 0 2px 0 #c77d00; }
  .tile.used { opacity: 0; pointer-events: none; transform: scale(.6); }
  .pz-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .pz-fb { min-height: 34px; color: #fff; font-size: 22px; font-weight: 800; text-shadow: 0 2px 6px rgba(0,0,0,.4); text-align: center; }
  .pz-fb b { color: #bff3cf; }
  .pz-fb.bad b { color: #ffd0cb; }
</style>
</head>
<body>

<!-- ===================== ÖĞRETMEN KURULUM ===================== -->
<div id="setup" class="screen">
  <div class="card">
    <div id="teacherBarHost"></div>
    <h1>🧩 Harf <span>Puzzle</span></h1>
    <p class="sub">Her soru için bir resim (ya da emoji) ve yazılışını ekleyin. Harfler karışık parçalar olarak dağılır, öğrenci doğru sırayla dizer.</p>

    <label>Sorular <small>(istediğiniz kadar ekleyin; resim bilgisayardan seçilir, küçültülerek saklanır)</small></label>
    <div class="items" id="items"></div>
    <div class="addrow">
      <button class="btn secondary" id="btnAdd">+ Soru ekle</button>
      <button class="btn secondary" id="btnExample">Örnek doldur</button>
    </div>
    <input type="file" id="file" accept="image/*" class="hidden">

    <div class="cols four">
      <div>
        <label for="order">Soru sırası</label>
        <select id="order"><option value="random" selected>Karışık</option><option value="fixed">Yazıldığı sıra</option></select>
      </div>
      <div>
        <label for="time">Soru başına süre</label>
        <select id="time"><option value="0">Süresiz</option><option value="15">15 sn</option><option value="30" selected>30 sn</option><option value="45">45 sn</option><option value="60">60 sn</option></select>
      </div>
      <div>
        <label for="extra">Fazladan harf</label>
        <select id="extra"><option value="0" selected>Yok</option><option value="2">2 harf</option><option value="4">4 harf</option></select>
      </div>
      <div>
        <label for="hint">İpucu</label>
        <select id="hint"><option value="0" selected>Yok</option><option value="1">İlk harf açık</option></select>
      </div>
    </div>
    <p class="hint">Öğrenci "Tamam" deyince cevap kontrol edilir, yanlışsa doğrusu gösterilir ve sonraki soruya geçilir.</p>

    <div class="err" id="setupErr"></div>
    <div class="row">
      <button class="btn" id="btnStart">▶ Oyunu Dene</button>
      <button class="btn" id="btnShare">🎟 Öğrenci Kodu Oluştur</button>
      <button class="btn secondary" id="btnLbSetup">🏆 Skor Tablosu</button>
    </div>
    <div id="sharePanelHost"></div>
  </div>
</div>

<!-- ===================== OYUN ===================== -->
<div id="game" class="screen hidden">
  <div class="hud">
    <div class="pill" id="hudPlayer">👤</div>
    <div class="pill progress" id="hudScore">⭐ 0</div>
    <div class="q"></div>
    <div class="pill progress" id="hudProg">1/1</div>
    <div class="pill progress" id="hudTime">⏱ 30</div>
    <div class="pill pauseBtn" id="btnQuit" title="Çıkış">✕</div>
  </div>
  <div class="pz" id="pz">
    <div class="pz-img" id="pzImg"></div>
    <div class="slots" id="slots"></div>
    <div class="tiles" id="tiles"></div>
    <div class="pz-actions">
      <button class="btn secondary" id="btnUndo">⌫ Sil</button>
      <button class="btn secondary" id="btnShuffle">🔀 Karıştır</button>
      <button class="btn ok big" id="btnOk">✔ Tamam</button>
    </div>
    <div class="pz-fb" id="fb"></div>
  </div>
  <div id="countdown" class="hidden"></div>
</div>

<script src="../../shared/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../../shared/egido.js"></script>
<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const { sfx, escapeHtml, shuffle } = Egido;
  const up = s => s.toLocaleUpperCase('tr');
  const ALPHABET = 'ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ';

  // ---------- Öğretmen: soru listesi ----------
  let items = []; // [{ img: 'data:...' | 'https://...' | 'emoji:🐘' | '', word: 'FİL' }]
  let fileTarget = -1;
  function renderItems() {
    const box = $('#items');
    box.innerHTML = items.map((it, i) => `
      <div class="item" data-i="${i}">
        <div class="thumb ${it.img ? '' : 'empty'}" title="Resim seç">${thumbHtml(it.img)}</div>
        <input type="text" class="imgsrc" placeholder="Resim seç ↖ ya da emoji / resim adresi yaz" value="${it.img.startsWith('data:') ? '' : escapeHtml(it.img.replace(/^emoji:/, ''))}">
        <input type="text" class="word" placeholder="Yazılışı (örn: FİL)" maxlength="24" value="${escapeHtml(it.word)}">
        <button class="rm" title="Sil">✕</button>
      </div>`).join('') || '<div class="hint">Henüz soru yok. "Soru ekle" ile başlayın.</div>';
    box.querySelectorAll('.item').forEach(row => {
      const i = +row.dataset.i;
      row.querySelector('.thumb').onclick = () => { fileTarget = i; $('#file').value = ''; $('#file').click(); };
      row.querySelector('.word').oninput = e => { items[i].word = e.target.value; };
      row.querySelector('.imgsrc').onchange = e => {
        const v = e.target.value.trim();
        items[i].img = !v ? (items[i].img.startsWith('data:') ? items[i].img : '') : /^https?:\/\//i.test(v) ? v : 'emoji:' + v;
        renderItems();
      };
      row.querySelector('.rm').onclick = () => { items.splice(i, 1); renderItems(); };
    });
  }
  function thumbHtml(img) {
    if (!img) return '📷';
    if (img.startsWith('emoji:')) return escapeHtml(img.slice(6));
    return `<img src="${escapeHtml(img)}" alt="">`;
  }
  $('#btnAdd').onclick = () => { items.push({ img: '', word: '' }); renderItems(); const rows = document.querySelectorAll('.item .word'); if (rows.length) rows[rows.length - 1].focus(); };
  // Resmi küçültüp JPEG olarak sakla: ayarların içinde taşınır, ayrı depolama gerekmez
  $('#file').onchange = () => {
    const f = $('#file').files[0]; if (!f || fileTarget < 0) return;
    const url = URL.createObjectURL(f), im = new Image();
    im.onload = () => {
      const MAX = 420, sc = Math.min(1, MAX / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
      items[fileTarget].img = c.toDataURL('image/jpeg', .82);
      URL.revokeObjectURL(url); renderItems();
    };
    im.onerror = () => { Egido.toast('Resim okunamadı.'); URL.revokeObjectURL(url); };
    im.src = url;
  };
  $('#btnExample').onclick = () => {
    writeConfig({ items: [
      { img: 'emoji:🐘', word: 'FİL' }, { img: 'emoji:🍎', word: 'ELMA' }, { img: 'emoji:🚗', word: 'ARABA' },
      { img: 'emoji:🐱', word: 'KEDİ' }, { img: 'emoji:🌙', word: 'AY' }, { img: 'emoji:🍓', word: 'ÇİLEK' },
    ], order: 'random', time: 30, extra: 0, hint: 0 });
  };

  function readConfig() {
    return { items: items.map(it => ({ img: it.img || '', word: up(it.word.trim()).replace(/\s+/g, ' ') })).filter(it => it.word),
      order: $('#order').value, time: +$('#time').value, extra: +$('#extra').value, hint: +$('#hint').value };
  }
  function writeConfig(c) {
    items = (c.items || []).map(it => ({ img: it.img || '', word: it.word || '' }));
    $('#order').value = c.order || 'random'; $('#time').value = c.time != null ? c.time : 30;
    $('#extra').value = c.extra != null ? c.extra : 0; $('#hint').value = c.hint != null ? c.hint : 0;
    renderItems();
  }
  function validate(c) {
    if (!Array.isArray(c.items) || !c.items.length) return 'En az bir soru ekleyin (resim + yazılışı).';
    for (const it of c.items) {
      const letters = it.word.replace(/ /g, '');
      if (letters.length < 2) return `"${it.word}" çok kısa; en az 2 harf olmalı.`;
      if (letters.length > 16) return `"${it.word}" çok uzun; en fazla 16 harf olmalı.`;
    }
    return '';
  }

  // ---------- Oyun ----------
  const G = { cfg: null, running: false, order: [], idx: 0, score: 0, correct: 0, wrong: 0, missed: [], t0: 0, slots: [], tiles: [], locked: false, timer: null, timeLeft: 0, elapsedQ: 0 };
  const cur = () => G.cfg.items[G.order[G.idx]];

  function startGame(cfg) {
    G.cfg = cfg;
    Object.assign(G, { running: true, idx: 0, score: 0, correct: 0, wrong: 0, missed: [], t0: performance.now(), locked: false });
    G.order = cfg.items.map((_, i) => i); if (cfg.order === 'random') G.order = shuffle(G.order);
    const p = Egido.player; $('#hudPlayer').textContent = '👤 ' + p.name + (p.cls ? ' · ' + p.cls : '');
    $('#hudTime').classList.toggle('hidden', !cfg.time);
    $('#pz').style.visibility = 'hidden';
    Egido.countdown(3, () => { $('#pz').style.visibility = ''; showQuestion(); }, () => G.running);
  }

  function showQuestion() {
    if (!G.running) return;
    const q = cur(), word = q.word, letters = word.replace(/ /g, '').split('');
    $('#hudScore').textContent = '⭐ ' + G.score;
    $('#hudProg').textContent = `${G.idx + 1}/${G.order.length}`;
    $('#fb').textContent = ''; $('#fb').classList.remove('bad');
    $('#pzImg').innerHTML = !q.img ? '<div class="none">Kelimeyi yaz</div>' : q.img.startsWith('emoji:') ? `<div class="emo">${escapeHtml(q.img.slice(6))}</div>` : `<img src="${escapeHtml(q.img)}" alt="">`;
    // kutu boyutu: harf sayısına göre küçülür
    const tz = Math.max(40, Math.min(72, Math.floor((Math.min(window.innerWidth, 900) - 40) / (word.length + 1)) - 8));
    document.documentElement.style.setProperty('--tz', tz + 'px');

    // Yuvalar: her harf için bir yuva, boşluklar için aralık
    G.slots = word.split('').map(ch => ({ ch, gap: ch === ' ', tile: null, locked: false }));
    // Parçalar: harfler + fazladan harfler, karışık
    let pool = letters.slice();
    for (let i = 0; i < G.cfg.extra; i++) pool.push(ALPHABET[Math.floor(Math.random() * ALPHABET.length)]);
    let order = shuffle(pool);
    for (let t = 0; t < 5 && order.join('') === letters.join(''); t++) order = shuffle(pool); // harfler yerli yerinde kalmasın
    G.tiles = order.map((ch, i) => ({ id: i, ch, used: false, rot: (Math.random() * 16 - 8).toFixed(1) + 'deg' }));
    if (G.cfg.hint) { // ilk harf açık
      const s = G.slots.find(x => !x.gap), t = G.tiles.find(x => x.ch === s.ch);
      s.tile = t.id; s.locked = true; t.used = true;
    }
    G.locked = false;
    renderPuzzle();
    startTimer();
  }
  function renderPuzzle() {
    $('#slots').innerHTML = G.slots.map((s, i) => s.gap ? '<div class="slot gap"></div>' :
      `<div class="slot ${s.tile != null ? 'filled' : ''} ${s.locked ? 'locked' : ''}" data-i="${i}">${s.tile != null ? escapeHtml(G.tiles[s.tile].ch) : ''}</div>`).join('');
    $('#tiles').innerHTML = G.tiles.map(t => `<div class="tile ${t.used ? 'used' : ''}" data-id="${t.id}" style="--rot:${t.rot}">${escapeHtml(t.ch)}</div>`).join('');
    $('#slots').querySelectorAll('.slot.filled:not(.locked)').forEach(el => el.onclick = () => unplace(+el.dataset.i));
    $('#tiles').querySelectorAll('.tile:not(.used)').forEach(el => el.onclick = () => place(+el.dataset.id));
  }
  function place(tileId) {
    if (G.locked) return;
    const s = G.slots.find(x => !x.gap && x.tile == null); if (!s) return;
    s.tile = tileId; G.tiles[tileId].used = true; sfx.click(); renderPuzzle();
  }
  function unplace(i) {
    if (G.locked) return;
    const s = G.slots[i]; if (s.tile == null || s.locked) return;
    G.tiles[s.tile].used = false; s.tile = null; renderPuzzle();
  }
  $('#btnUndo').onclick = () => { for (let i = G.slots.length - 1; i >= 0; i--) if (G.slots[i].tile != null && !G.slots[i].locked) { unplace(i); return; } };
  $('#btnShuffle').onclick = () => { if (G.locked) return; G.tiles.forEach(t => t.rot = (Math.random() * 16 - 8).toFixed(1) + 'deg'); const free = shuffle(G.tiles.filter(t => !t.used)); let k = 0; G.tiles = G.tiles.map(t => t.used ? t : free[k++]); renderPuzzle(); };
  $('#btnOk').onclick = confirm_;
  document.addEventListener('keydown', e => {
    if (!G.running || G.locked || $('#game').classList.contains('hidden')) return;
    if (e.key === 'Enter') return confirm_();
    if (e.key === 'Backspace') return $('#btnUndo').click();
    if (e.key.length === 1) { const ch = up(e.key); const t = G.tiles.find(x => !x.used && x.ch === ch); if (t) place(t.id); }
  });

  function startTimer() {
    stopTimer();
    if (!G.cfg.time) return;
    G.timeLeft = G.cfg.time; $('#hudTime').textContent = '⏱ ' + G.timeLeft; $('#hudTime').style.color = '';
    let last = performance.now();
    G.timer = setInterval(() => {
      const now = performance.now(); G.timeLeft -= (now - last) / 1000; last = now;
      const s = Math.max(0, Math.ceil(G.timeLeft)); $('#hudTime').textContent = '⏱ ' + s; $('#hudTime').style.color = s <= 5 ? '#ffd1cc' : '';
      if (G.timeLeft <= 0) { stopTimer(); judge(false, true); }
    }, 100);
  }
  function stopTimer() { if (G.timer) { clearInterval(G.timer); G.timer = null; } }

  function confirm_() {
    if (!G.running || G.locked) return;
    const filled = G.slots.every(s => s.gap || s.tile != null);
    if (!filled) { $('#slots').classList.remove('shake'); void $('#slots').offsetWidth; $('#slots').classList.add('shake'); Egido.toast('Önce tüm harfleri yerleştir.'); return; }
    const answer = G.slots.map(s => s.gap ? ' ' : G.tiles[s.tile].ch).join('');
    judge(answer === cur().word, false);
  }
  function judge(ok, timeout) {
    G.locked = true; stopTimer();
    const word = cur().word;
    $('#slots').querySelectorAll('.slot:not(.gap)').forEach(el => el.classList.add(ok ? 'ok' : 'bad'));
    if (ok) {
      const bonus = G.cfg.time ? Math.round(Math.max(0, G.timeLeft) / G.cfg.time * 5) : 0;
      G.score += 10 + bonus; G.correct++;
      $('#fb').innerHTML = `<b>Doğru! +${10 + bonus}</b>`; sfx.good();
    } else {
      G.wrong++; G.missed.push(word);
      $('#fb').classList.add('bad'); $('#fb').innerHTML = `${timeout ? 'Süre doldu. ' : 'Yanlış. '}Doğrusu: <b>${escapeHtml(word)}</b>`; sfx.bad();
    }
    $('#hudScore').textContent = '⭐ ' + G.score;
    setTimeout(() => { if (!G.running) return; G.idx++; if (G.idx >= G.order.length) endGame(); else showQuestion(); }, ok ? 1200 : 2200);
  }
  $('#btnQuit').onclick = () => { if (G.running && confirm('Oyundan çıkılsın mı? Skor kaydedilmez.')) endGame('quit'); };

  function endGame(kind) {
    G.running = false; stopTimer();
    const total = G.order.length, time = (performance.now() - G.t0) / 1000;
    const r = { kind: kind || (G.correct === total ? 'win' : 'lose'), score: G.score, correct: G.correct, total, wrong: G.wrong, time, missed: G.missed, missedTitle: 'Yanlış yazılan kelimeler:' };
    if (kind === 'quit') { r.emoji = '🚪'; r.title = 'Oyundan çıkıldı'; }
    else if (r.kind === 'win') { r.emoji = '🏆'; r.title = 'Mükemmel!'; r.msg = 'Bütün kelimeleri doğru yazdın.'; sfx.win(); }
    else { r.emoji = G.correct >= total / 2 ? '🎉' : '💪'; r.title = 'Oyun bitti'; r.msg = `${total} kelimeden ${G.correct} tanesini doğru yazdın.`; (G.correct >= total / 2 ? sfx.win : sfx.lose)(); }
    Egido.finish(r);
  }

  renderItems();
  Egido.init({
    gameId: 'puzzle', gameName: 'Harf Puzzle', emoji: '🧩',
    introRules: 'Resme bak, karışık harf parçalarına dokunarak kelimeyi doğru sırayla diz. Her doğru kelime <b class="ok">+10 puan</b>, hızlı bitirirsen bonus var.',
    readConfig, writeConfig, validate,
    summary: c => `Harf Puzzle · ${(c.items || []).length} kelime`,
    startGame,
  });
})();
</script>
</body>
</html>
