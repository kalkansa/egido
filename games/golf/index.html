<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kara Tahta</title>
<link rel="icon" type="image/svg+xml" href="../../shared/logo.svg?v=202610051701">
<link rel="stylesheet" href="../../shared/egido.css?v=202610051708">
<style>
  .ta-ok { border-color: #bfe9cf; } .ta-ok:focus { border-color: var(--ok); }
  .ta-bad { border-color: #f5c6c1; } .ta-bad:focus { border-color: var(--bad); }
  body.playing { background: linear-gradient(180deg, #8ad4ff 0%, #bfe6ff 22%, #3f9d4a 22%, #2f8a3e 100%); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
  .hud .lives { letter-spacing: 2px; font-size: 18px; }
  .qbar { position: absolute; top: 58px; left: 0; right: 0; padding: 6px 18px; text-align: center; pointer-events: none; z-index: 2; }
  .qbar div { display: inline-block; max-width: min(1100px, 96%); background: rgba(0,0,0,.4); backdrop-filter: blur(4px); color: #fff; border-radius: 16px; padding: 10px 22px; font-weight: 800; font-size: clamp(20px, 3.2vw, 34px); line-height: 1.25; text-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .flashBad { position: fixed; inset: 0; pointer-events: none; z-index: 3; box-shadow: inset 0 0 140px rgba(231,76,60,0); transition: box-shadow .35s; }
  .flashBad.on { box-shadow: inset 0 0 140px rgba(231,76,60,.75); transition: none; }
</style>
</head>
<body>

<!-- ===================== ÖĞRETMEN KURULUM ===================== -->
<div id="setup" class="screen">
  <div class="card">
    <div id="teacherBarHost"></div>
    <h1 data-i18n="golf.title"></h1>
    <p class="sub" data-i18n="golf.sub"></p>
    <div class="row" style="margin:0 0 4px"><button class="btn secondary small" id="btnExample" data-i18n="setup.example"></button></div>

    <label for="question" data-i18n="balon.q"></label>
    <input type="text" id="question" data-i18n-ph="balon.qPh" maxlength="160">

    <div class="cols">
      <div>
        <label for="correct" data-i18n="balon.correct"></label>
        <textarea id="correct" class="ta-ok" data-i18n-ph="balon.correctPh"></textarea>
      </div>
      <div>
        <label for="wrong" data-i18n="balon.wrong"></label>
        <textarea id="wrong" class="ta-bad" data-i18n-ph="balon.wrongPh"></textarea>
      </div>
    </div>

    <div class="cols three">
      <div>
        <label for="speed" data-i18n="balon.speed"></label>
        <select id="speed"><option value="1" data-i18n="balon.speed1"></option><option value="2" selected data-i18n="balon.speed2"></option><option value="3" data-i18n="balon.speed3"></option><option value="4" data-i18n="balon.speed4"></option></select>
      </div>
      <div>
        <label for="lives" data-i18n="balon.lives"></label>
        <select id="lives"><option value="1">1</option><option value="3" selected>3</option><option value="5">5</option><option value="0" data-i18n="balon.unlimited"></option></select>
      </div>
      <div>
        <label for="duration" data-i18n="balon.duration"></label>
        <select id="duration"><option value="0" data-i18n="balon.noTime"></option><option value="30">30 s</option><option value="60">60 s</option><option value="90" selected>90 s</option><option value="120" data-i18n="balon.min2"></option></select>
      </div>
    </div>
    <p class="hint" data-i18n="golf.hint"></p>

    <div class="err" id="setupErr"></div>
    <div class="row">
      <button class="btn" id="btnStart" data-i18n="setup.try"></button>
      <button class="btn" id="btnShare" data-i18n="setup.code"></button>
      <button class="btn secondary" id="btnLbSetup" data-i18n="setup.lb"></button>
    </div>
    <div id="sharePanelHost"></div>
  </div>
</div>

<!-- ===================== OYUN ===================== -->
<div id="game" class="screen hidden">
  <div class="hud">
    <div class="pill" id="hudPlayer">👤</div>
    <div class="pill progress" id="hudScore">⭐ 0</div>
    <div class="q"></div>
    <div class="pill progress" id="hudLeft">⛳ 0/0</div>
    <div class="pill lives" id="hudLives">❤❤❤</div>
    <div class="pill progress" id="hudTime">⏱ 90</div>
    <div class="pill pauseBtn" id="btnPause">⏸</div>
  </div>
  <div class="qbar"><div id="hudQ"></div></div>
  <canvas id="c"></canvas>
  <div class="flashBad" id="flashBad"></div>
  <div id="countdown" class="hidden"></div>
  <div id="pauseOverlay" class="hidden">
    <div class="card" style="width:auto;text-align:center">
      <h2 style="margin-top:0" data-i18n="balon.paused"></h2>
      <div class="row" style="justify-content:center">
        <button class="btn" id="btnResume" data-i18n="balon.resume"></button>
        <button class="btn secondary" id="btnQuit" data-i18n="balon.quit"></button>
      </div>
    </div>
  </div>
</div>

<script src="../../shared/config.js?v=202610051708"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../../shared/i18n.js?v=202610051708"></script>
<script src="../../shared/ui.js?v=202610051708"></script>
<script src="../../shared/header.js?v=202610051708"></script>
<script src="../../shared/egido.js?v=202610051708"></script>
<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const t = I18N.t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const ease = x => 1 - Math.pow(1 - x, 3);
  const { sfx, tone } = Egido;

  // ---------- Ayarlar (Gol Vuruşu ile aynı model) ----------
  const parseLines = s => [...new Set(s.split('\n').map(x => x.trim()).filter(Boolean))];
  function readConfig() {
    return { q: $('#question').value.trim(), correct: parseLines($('#correct').value), wrong: parseLines($('#wrong').value),
      speed: +$('#speed').value, lives: +$('#lives').value, duration: +$('#duration').value };
  }
  function writeConfig(c) {
    $('#question').value = c.q || '';
    $('#correct').value = (c.correct || []).join('\n'); $('#wrong').value = (c.wrong || []).join('\n');
    $('#speed').value = c.speed != null ? c.speed : 2; $('#lives').value = c.lives != null ? c.lives : 3; $('#duration').value = c.duration != null ? c.duration : 90;
  }
  function validate(c) {
    if (!Array.isArray(c.correct) || !c.correct.length) return t('balon.errCorrect');
    if (!Array.isArray(c.wrong) || !c.wrong.length) return t('balon.errWrong');
    const lowWrong = c.wrong.map(w => w.toLocaleLowerCase());
    const dup = c.correct.filter(x => lowWrong.includes(x.toLocaleLowerCase()));
    if (dup.length) return t('balon.errDup', { d: dup.join(', ') });
    return '';
  }
  $('#btnExample').onclick = () => writeConfig({ q: t('balon.exQ'), correct: t('balon.exCorrect').split('|'), wrong: t('balon.exWrong').split('|'), speed: 2, lives: 3, duration: 90 });

  // ---------- Sahne ----------
  const canvas = $('#c'), ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1, TOP = 120;
  const L = {};
  function resize() {
    if (!canvas.clientWidth || !canvas.clientHeight) return;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const qb = $('#hudQ').getBoundingClientRect(); TOP = Math.max(100, qb.bottom + 10);
    const gy = TOP + (H * .78 - TOP) * .42;                     // green merkezi
    L.green = { x: W / 2, y: gy, rx: clamp(W * .3, 170, 330), ry: clamp((H * .78 - TOP) * .3, 70, 140) };
    L.hole = { x: W / 2, y: gy - L.green.ry * .2, r: clamp(W / 60, 11, 16) };
    L.bunker = { x: W / 2 - L.green.rx * 1.25, y: gy + L.green.ry * .5, rx: clamp(W * .09, 50, 90), ry: clamp(H * .035, 20, 36) };
    L.pond = { x: W / 2 + L.green.rx * 1.3, y: gy + L.green.ry * .45, rx: clamp(W * .1, 55, 100), ry: clamp(H * .04, 22, 40) };
    L.laneY = H - 70; L.player = { x: W / 2, y: L.laneY - 18 }; L.ballR = clamp(W / 42, 13, 19);
  }
  window.addEventListener('resize', () => { if (G.running) resize(); });

  const G = { cfg: null, running: false, paused: false, balls: [], shot: null, particles: [], floaters: [], score: 0, lives: 3,
    remaining: new Set(), onScreen: new Set(), holes: 0, misses: 0, combo: 0, elapsed: 0, timeLeft: 0, spawnT: 0, last: 0, raf: 0, shakeT: 0, swing: 0, flagT: 0, cheer: 0 };

  function makeBall(text, isCorrect) {
    ctx.font = `700 16px "Segoe UI", system-ui, sans-serif`;
    const bw = clamp(ctx.measureText(text).width + 24, 60, 220);
    const fromRight = Math.random() < .5;
    const last = G.balls.filter(b => b.fromRight === fromRight).sort((a, b) => fromRight ? b.x - a.x : a.x - b.x)[0];
    let x = fromRight ? W + bw / 2 + 10 : -bw / 2 - 10;
    if (last) x = fromRight ? Math.max(x, last.x + last.bw / 2 + bw / 2 + 30) : Math.min(x, last.x - last.bw / 2 - bw / 2 - 30);
    const base = [40, 65, 95, 130][G.cfg.speed - 1];
    return { text, isCorrect, bw, fromRight, x, y: L.laneY, vx: (fromRight ? -1 : 1) * base * rand(.85, 1.15), rot: 0 };
  }
  function spawn() {
    const maxOnScreen = clamp(Math.round(W / 170), 3, 7);
    if (G.balls.length >= maxOnScreen) return;
    const availCorrect = [...G.remaining].filter(a => !G.onScreen.has(a));
    const availWrong = G.cfg.wrong.filter(a => !G.onScreen.has(a));
    const pCorrect = G.remaining.size <= 2 ? .6 : .45;
    let text, isCorrect;
    if (availCorrect.length && (Math.random() < pCorrect || !availWrong.length)) { text = pick(availCorrect); isCorrect = true; }
    else if (availWrong.length) { text = pick(availWrong); isCorrect = false; }
    else if (availCorrect.length) { text = pick(availCorrect); isCorrect = true; }
    else return;
    G.onScreen.add(text); G.balls.push(makeBall(text, isCorrect));
  }

  function startGame(cfg) {
    G.cfg = cfg;
    Object.assign(G, { running: true, paused: false, balls: [], shot: null, particles: [], floaters: [], score: 0, lives: cfg.lives || Infinity,
      remaining: new Set(cfg.correct), onScreen: new Set(), holes: 0, misses: 0, combo: 0, elapsed: 0, timeLeft: cfg.duration || Infinity, spawnT: .4, shakeT: 0, swing: 0, flagT: 0, cheer: 0 });
    document.body.classList.add('playing');
    $('#hudQ').textContent = cfg.q || t('golf.default');
    const p = Egido.player; $('#hudPlayer').textContent = '👤 ' + p.name + (p.cls ? ' · ' + p.cls : '');
    $('#hudTime').classList.toggle('hidden', !cfg.duration); $('#hudLives').classList.toggle('hidden', !cfg.lives);
    $('#pauseOverlay').classList.add('hidden');
    resize(); updateHud(); draw();
    Egido.countdown(3, () => { G.last = performance.now(); G.raf = requestAnimationFrame(loop); }, () => G.running);
  }
  function updateHud() {
    $('#hudScore').textContent = '⭐ ' + G.score;
    $('#hudLeft').textContent = `⛳ ${G.cfg.correct.length - G.remaining.size}/${G.cfg.correct.length}`;
    if (G.cfg.lives) $('#hudLives').textContent = '❤'.repeat(Math.max(0, G.lives)) + '🖤'.repeat(Math.max(0, G.cfg.lives - G.lives));
    if (G.cfg.duration) { const s = Math.max(0, Math.ceil(G.timeLeft)); $('#hudTime').textContent = '⏱ ' + s; $('#hudTime').style.color = s <= 10 ? '#ffd1cc' : ''; }
  }

  // ---------- Döngü ----------
  function loop(now) {
    if (!G.running) return;
    const dt = Math.min(.05, (now - G.last) / 1000); G.last = now;
    if (!G.paused) update(dt);
    if (!G.running) return;
    draw(); G.raf = requestAnimationFrame(loop);
  }
  function update(dt) {
    G.elapsed += dt; G.flagT += dt;
    if (G.cfg.duration) {
      const before = Math.ceil(G.timeLeft); G.timeLeft -= dt;
      if (Math.ceil(G.timeLeft) !== before && G.timeLeft <= 10 && G.timeLeft > 0) sfx.tick();
      if (G.timeLeft <= 0) { G.timeLeft = 0; updateHud(); return endGame(G.remaining.size === 0 ? 'win' : 'timeout'); }
      updateHud();
    }
    const interval = [2.0, 1.6, 1.25, 1.0][G.cfg.speed - 1];
    G.spawnT -= dt; if (G.spawnT <= 0) { spawn(); G.spawnT = interval * rand(.8, 1.2); }
    for (let i = G.balls.length - 1; i >= 0; i--) {
      const b = G.balls[i]; b.x += b.vx * dt; b.rot += (b.vx / L.ballR) * dt; b.y = L.laneY;
      if ((b.vx < 0 && b.x < -b.bw) || (b.vx > 0 && b.x > W + b.bw)) { G.balls.splice(i, 1); G.onScreen.delete(b.text); }
    }
    if (G.shot) updateShot(dt);
    if (G.swing > 0) G.swing -= dt;
    if (G.cheer > 0) G.cheer -= dt;
    for (let i = G.particles.length - 1; i >= 0; i--) { const p = G.particles[i]; p.life -= dt; if (p.life <= 0) { G.particles.splice(i, 1); continue; } p.vy += (p.g || 500) * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; }
    for (let i = G.floaters.length - 1; i >= 0; i--) { const f = G.floaters[i]; f.life -= dt; f.y -= 50 * dt; if (f.life <= 0) G.floaters.splice(i, 1); }
    if (G.shakeT > 0) G.shakeT -= dt;
  }

  // ---------- Vuruş ----------
  function shoot(i) {
    const b = G.balls.splice(i, 1)[0]; G.onScreen.delete(b.text);
    let outcome, tx, ty;
    if (b.isCorrect) { tx = L.hole.x; ty = L.hole.y; outcome = 'hole'; }
    else if (Math.random() < .5) { tx = L.hole.x + rand(-6, 6); ty = L.hole.y + 4; outcome = 'lip'; }           // deliğin kenarından döner
    else if (Math.random() < .5) { tx = L.bunker.x + rand(-20, 20); ty = L.bunker.y + rand(-8, 8); outcome = 'bunker'; }
    else { tx = L.pond.x + rand(-20, 20); ty = L.pond.y + rand(-6, 6); outcome = 'water'; }
    G.shot = { b, phase: 'approach', t: 0, sx: b.x, sy: b.y, px: L.player.x, py: L.player.y + 14, tx, ty, outcome, x: b.x, y: b.y, s: 1, rot: b.rot, trail: [] };
  }
  function updateShot(dt) {
    const s = G.shot; s.t += dt;
    if (s.phase === 'approach') {
      const k = Math.min(1, s.t / .18); s.x = s.sx + (s.px - s.sx) * k; s.y = s.sy + (s.py - s.sy) * k; s.rot += 10 * dt;
      if (k >= 1) { s.phase = 'roll'; s.t = 0; G.swing = .45; tone(900, .06, 'square', .15, 0, 500); }
    } else if (s.phase === 'roll') {
      const k = Math.min(1, s.t / .9), e = ease(k);
      s.x = s.px + (s.tx - s.px) * e; s.y = s.py + (s.ty - s.py) * e; s.s = 1 - .35 * e; s.rot += 16 * (1 - k) * dt + 2 * dt;
      s.trail.push({ x: s.x, y: s.y, life: .4 }); s.trail.forEach(p => p.life -= dt); s.trail = s.trail.filter(p => p.life > 0);
      if (k >= 1) resolveShot();
    } else if (s.phase === 'after') {
      if (s.outcome === 'hole') { s.s = Math.max(0, s.s - dt * 1.6); s.y += 18 * dt; }
      else if (s.outcome === 'lip') { s.lipT += dt; const a = s.lipA + s.lipT * 9; if (s.lipT < .7) { s.x = L.hole.x + Math.cos(a) * (L.hole.r + 4); s.y = L.hole.y + Math.sin(a) * (L.hole.r + 4) * .6; } else { s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= .97; s.vy *= .97; } }
      else if (s.outcome === 'water') { s.s = Math.max(0, s.s - dt * 2); }
      if (s.t > 1.1) { G.shot = null; afterShot(); }
    }
  }
  function resolveShot() {
    const s = G.shot; s.phase = 'after'; s.t = 0;
    if (s.outcome === 'hole') {
      G.combo++; const bonus = Math.min(G.combo - 1, 5) * 2, pts = 10 + bonus;
      G.score += pts; G.holes++; G.remaining.delete(s.b.text); G.cheer = .8;
      floater(t('golf.hole') + ' +' + pts + (bonus ? ' 🔥' : ''), L.hole.x, L.hole.y - 40, '#fff', 50);
      tone(700, .08, 'sine', .2); tone(1050, .3, 'triangle', .25, .1); sfx.win();
      for (let i = 0; i < 24; i++) { const a = rand(0, Math.PI * 2), sp = rand(80, 260), life = rand(.5, 1); G.particles.push({ x: L.hole.x, y: L.hole.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 150, life, max: life, s: rand(5, 10), rot: rand(0, 6), vr: rand(-8, 8), color: pick(['#ffd43b', '#fff', '#69db7c', '#4dabf7', '#f783ac']) }); }
    } else {
      G.combo = 0; G.misses++; G.score = Math.max(0, G.score - 5); if (G.cfg.lives) G.lives--;
      if (s.outcome === 'lip') { s.lipT = 0; s.lipA = Math.atan2(s.y - L.hole.y, s.x - L.hole.x); const dir = Math.random() < .5 ? -1 : 1; s.vx = dir * rand(60, 110); s.vy = rand(30, 70); tone(500, .1, 'square', .15); tone(380, .15, 'square', .15, .1); }
      else if (s.outcome === 'bunker') { for (let i = 0; i < 18; i++) { const a = rand(-Math.PI, 0), sp = rand(60, 200); G.particles.push({ x: s.x, y: s.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(.4, .8), max: .8, s: rand(3, 6), rot: 0, vr: 0, color: '#e9d8a6', g: 600 }); } tone(200, .2, 'sawtooth', .15, 0, 120); }
      else { for (let i = 0; i < 20; i++) { const a = rand(-Math.PI * .95, -Math.PI * .05), sp = rand(80, 240); G.particles.push({ x: s.x, y: s.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(.4, .9), max: .9, s: rand(3, 6), rot: 0, vr: 0, color: '#cfefff', g: 700 }); } tone(160, .3, 'sine', .25, 0, 70); }
      floater(t(s.outcome === 'lip' ? 'golf.lip' : s.outcome === 'bunker' ? 'golf.bunker' : 'golf.water'), L.hole.x, L.hole.y - 40, '#ffb3ab', 42);
      sfx.bad(); G.shakeT = .25;
      const fb = $('#flashBad'); fb.classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => fb.classList.remove('on')));
    }
    updateHud();
  }
  function afterShot() {
    if (G.remaining.size === 0) return endGame('win');
    if (G.cfg.lives && G.lives <= 0) return endGame('lose');
  }
  const floater = (text, x, y, color, size = 30) => G.floaters.push({ text, x, y, color, size, life: 1.1 });

  // ---------- Çizim ----------
  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function drawCourse() {
    // çim şeritleri (biçilmiş çim)
    for (let i = 0; i < 8; i++) { ctx.fillStyle = i % 2 ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)'; const y0 = TOP - 10 + (H - TOP) * i / 8; ctx.fillRect(0, y0, W, (H - TOP) / 8 + 1); }
    const g = L.green;
    // su (pond) ve kum (bunker)
    ctx.fillStyle = '#5bb8ff'; ctx.beginPath(); ctx.ellipse(L.pond.x, L.pond.y, L.pond.rx, L.pond.ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(L.pond.x, L.pond.y, L.pond.rx * .6, L.pond.ry * .45, 0, Math.PI * 1.1, Math.PI * 1.7); ctx.stroke();
    ctx.fillStyle = '#efdca8'; ctx.beginPath(); ctx.ellipse(L.bunker.x, L.bunker.y, L.bunker.rx, L.bunker.ry, -.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.beginPath(); ctx.ellipse(L.bunker.x + 6, L.bunker.y + 4, L.bunker.rx * .9, L.bunker.ry * .8, -.2, 0, Math.PI * 2); ctx.fill();
    // green: açık yeşil, çevresi fringe
    ctx.fillStyle = '#5fbf63'; ctx.beginPath(); ctx.ellipse(g.x, g.y, g.rx * 1.08, g.ry * 1.12, 0, 0, Math.PI * 2); ctx.fill();
    const gg = ctx.createRadialGradient(g.x, g.y, 10, g.x, g.y, g.rx); gg.addColorStop(0, '#a8e063'); gg.addColorStop(1, '#7ed56f');
    ctx.fillStyle = gg; ctx.beginPath(); ctx.ellipse(g.x, g.y, g.rx, g.ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1; for (let k = 1; k < 4; k++) { ctx.beginPath(); ctx.ellipse(g.x, g.y, g.rx * k / 4, g.ry * k / 4, 0, 0, Math.PI * 2); ctx.stroke(); }
    // yol (topların yuvarlandığı)
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(0, L.laneY - L.ballR - 8, W, L.ballR * 2 + 16);
    ctx.setLineDash([18, 14]); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, L.laneY + L.ballR + 4); ctx.lineTo(W, L.laneY + L.ballR + 4); ctx.stroke(); ctx.setLineDash([]);
  }
  function drawHole() {
    const h = L.hole, wave = Math.sin(G.flagT * 4) * 4 + (G.cheer > 0 ? Math.sin(G.flagT * 30) * 6 : 0);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(h.x + 2, h.y + 2, h.r + 3, (h.r + 3) * .6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1b2631'; ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r, h.r * .6, 0, 0, Math.PI * 2); ctx.fill();
    // bayrak direği ve bayrak
    const ph = clamp(H * .12, 60, 110);
    ctx.strokeStyle = '#ecf0f1'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(h.x, h.y); ctx.lineTo(h.x, h.y - ph); ctx.stroke();
    ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.moveTo(h.x, h.y - ph); ctx.quadraticCurveTo(h.x + 22 + wave, h.y - ph + 8, h.x + 42 + wave, h.y - ph + 14); ctx.lineTo(h.x, h.y - ph + 30); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '900 12px "Segoe UI", sans-serif'; ctx.textAlign = 'center'; ctx.fillText('1', h.x + 18 + wave * .5, h.y - ph + 20);
  }
  function drawGolfer() {
    const p = L.player, h = clamp(H * .11, 70, 110);
    const sw = G.swing > 0 ? Math.sin((.45 - G.swing) / .45 * Math.PI) : 0; // sopa salınımı
    ctx.save(); ctx.translate(p.x, p.y);
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(0, 4, h * .3, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = h * .1; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-h * .1, -h * .4); ctx.lineTo(-h * .14, 0); ctx.moveTo(h * .1, -h * .4); ctx.lineTo(h * .14, 0); ctx.stroke(); // bacaklar
    ctx.fillStyle = '#3498db'; roundRect(-h * .2, -h * .78, h * .4, h * .42, 8); ctx.fill();                                                                     // polo
    ctx.fillStyle = '#f5cba7'; ctx.beginPath(); ctx.arc(0, -h * .9, h * .13, 0, Math.PI * 2); ctx.fill();                                                        // kafa
    ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(0, -h * .95, h * .14, Math.PI, 0); ctx.fill(); ctx.fillRect(-h * .2, -h * .96, h * .36, h * .04);          // şapka
    // kollar + sopa: salınımla döner
    ctx.save(); ctx.translate(h * .1, -h * .6); ctx.rotate(-.5 + sw * 1.8);
    ctx.strokeStyle = '#3498db'; ctx.lineWidth = h * .09; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(h * .12, h * .25); ctx.stroke();
    ctx.strokeStyle = '#95a5a6'; ctx.lineWidth = h * .05; ctx.beginPath(); ctx.moveTo(h * .12, h * .25); ctx.lineTo(h * .2, h * .62); ctx.stroke();
    ctx.fillStyle = '#7f8c8d'; roundRect(h * .14, h * .6, h * .16, h * .07, 3); ctx.fill(); ctx.restore();
    ctx.restore();
  }
  function drawBall(x, y, r, rot) {
    if (!(r > 1.5)) return; // küçülüp kaybolan top: negatif yarıçapla çizim hatası olmasın
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(2, r * .95, r * .9, r * .28, 0, 0, Math.PI * 2); ctx.fill();
    ctx.rotate(rot);
    const g = ctx.createRadialGradient(-r * .35, -r * .35, r * .1, 0, 0, r); g.addColorStop(0, '#ffffff'); g.addColorStop(.7, '#f4f6f7'); g.addColorStop(1, '#b8c2cc');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.10)'; // çukurlar (dimple)
    for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6, d = r * (i % 2 ? .62 : .35); ctx.beginPath(); ctx.arc(Math.cos(a) * d, Math.sin(a) * d, r * .09, 0, Math.PI * 2); ctx.fill(); }
    ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(0, 0, r - .6, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  function drawLabel(x, y, text, w) {
    ctx.save(); ctx.font = `700 16px "Segoe UI", system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,.95)'; roundRect(x - w / 2, y - 16, w, 32, 10); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x - 7, y + 16); ctx.lineTo(x + 7, y + 16); ctx.lineTo(x, y + 24); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#14233a'; let size = 16; ctx.font = `700 ${size}px "Segoe UI", system-ui, sans-serif`;
    while (ctx.measureText(text).width > w - 16 && size > 10) { size--; ctx.font = `700 ${size}px "Segoe UI", system-ui, sans-serif`; }
    ctx.fillText(text, x, y); ctx.restore();
  }
  function draw() {
    if (canvas.clientWidth !== W || canvas.clientHeight !== H) resize();
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (G.shakeT > 0) ctx.translate(rand(-5, 5), rand(-5, 5));
    drawCourse(); drawHole();
    const s = G.shot;
    if (s && s.trail) for (const p of s.trail) { ctx.save(); ctx.globalAlpha = p.life * .5; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
    for (const b of G.balls) { drawBall(b.x, b.y, L.ballR, b.rot); drawLabel(b.x, b.y - L.ballR - 34, b.text, b.bw); }
    if (s && s.phase !== 'roll') { if (s.s > 0) drawBall(s.x, s.y, L.ballR * s.s, s.rot); drawGolfer(); }
    else { drawGolfer(); if (s && s.s > 0) drawBall(s.x, s.y, L.ballR * s.s, s.rot); }
    for (const p of G.particles) { ctx.save(); ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .7); ctx.restore(); }
    for (const f of G.floaters) { ctx.save(); ctx.globalAlpha = clamp(f.life / 1.1, 0, 1); ctx.fillStyle = f.color; ctx.font = `900 ${f.size}px "Segoe UI", system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 10; ctx.fillText(f.text, f.x, f.y); ctx.restore(); }
    ctx.restore();
  }

  // ---------- Etkileşim ----------
  function hit(px, py) {
    for (let i = G.balls.length - 1; i >= 0; i--) {
      const b = G.balls[i];
      if (Math.hypot(px - b.x, py - b.y) <= L.ballR + 12 || (Math.abs(px - b.x) <= b.bw / 2 && Math.abs(py - (b.y - L.ballR - 34)) <= 20)) return i;
    }
    return -1;
  }
  canvas.addEventListener('pointerdown', e => {
    if (!G.running || G.paused || G.shot) return;
    const r = canvas.getBoundingClientRect(), i = hit(e.clientX - r.left, e.clientY - r.top);
    if (i >= 0) shoot(i);
  });
  function setPaused(p) { if (!G.running) return; G.paused = p; $('#pauseOverlay').classList.toggle('hidden', !p); if (!p) G.last = performance.now(); }
  $('#btnPause').onclick = () => setPaused(true);
  $('#btnResume').onclick = () => setPaused(false);
  $('#btnQuit').onclick = () => { setPaused(false); endGame('quit'); };
  document.addEventListener('keydown', e => { if (G.running && (e.key === 'Escape' || e.key === 'p' || e.key === 'P')) setPaused(!G.paused); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.running) setPaused(true); });

  // ---------- Bitiş ----------
  function endGame(kind) {
    G.running = false; cancelAnimationFrame(G.raf); G.shot = null;
    document.body.classList.remove('playing'); $('#pauseOverlay').classList.add('hidden');
    const total = G.cfg.correct.length, got = total - G.remaining.size;
    const r = { kind, score: G.score, correct: got, total, wrong: G.misses, time: G.elapsed, missed: [...G.remaining], missedTitle: t('golf.missed') };
    if (kind === 'win') { r.emoji = G.misses === 0 ? '🏆' : '⛳'; r.title = G.misses === 0 ? t('golf.perfect') : t('res.won'); r.msg = G.misses === 0 ? t('golf.perfectMsg') : t('golf.wonMsg', { w: G.misses }); sfx.win(); }
    else if (kind === 'lose') { r.emoji = '🏌️'; r.title = t('golf.lost'); r.msg = t('golf.lostMsg', { t: total, g: got }); sfx.lose(); }
    else if (kind === 'timeout') { r.emoji = '⏰'; r.title = t('balon.timeout'); r.msg = t('golf.timeoutMsg', { t: total, g: got }); sfx.lose(); }
    else { r.emoji = '🚪'; }
    Egido.finish(r);
  }

  Egido.init({
    gameId: 'golf', emoji: '⛳',
    introRules: () => t('golf.rules'),
    readConfig, writeConfig, validate,
    summary: c => c.q || t('golf.default'),
    startGame,
  });
})();
</script>
</body>
