<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kara Tahta</title>
<link rel="icon" type="image/svg+xml" href="shared/logo.svg?v=202610051251">
<link rel="stylesheet" href="shared/egido.css?v=202610051507">
<style>
  body { overflow: auto; user-select: text; display: flex; flex-direction: column; align-items: center; padding: 36px 16px; min-height: 100vh; color: var(--ink); }
  body.has-topbar { padding-top: 84px; }
  h1 { font-size: clamp(28px, 5vw, 44px); margin: 0 0 6px; color: var(--bg1); }
  p.sub { margin: 0 0 26px; color: var(--muted); text-align: center; }
  .wrap { width: min(480px, 100%); display: grid; gap: 22px; }
  .panel { background: #fff; color: var(--ink); border-radius: var(--radius); padding: 24px 26px; box-shadow: 0 18px 50px rgba(20,60,110,.18); }
  .panel h2 { margin: 0 0 4px; font-size: 22px; }
  .panel p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .code-form { display: flex; gap: 10px; }
  .code-form input { flex: 1; font-size: 30px; font-weight: 800; letter-spacing: .35em; text-align: center; text-transform: uppercase; padding: 10px 6px 10px 14px; min-width: 0; }
  input[type=password] { width: 100%; font: inherit; font-size: 15px; padding: 10px 12px; border: 2px solid #d7deea; border-radius: 10px; outline: none; }
  input[type=password]:focus { border-color: var(--bg2); }
  .dash { width: min(980px, 100%); margin-top: 22px; }
  .dash-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .newgames { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 22px; }
  a.gcard { display: flex; gap: 12px; align-items: center; background: #fff; color: var(--ink); border-radius: 14px; padding: 14px 16px; text-decoration: none; box-shadow: 0 10px 30px rgba(20,60,110,.15); transition: transform .12s; }
  a.gcard:hover { transform: translateY(-3px); }
  a.gcard .emoji { font-size: 34px; }
  a.gcard b { display: block; font-size: 16px; }
  a.gcard small { color: var(--muted); }
  .mylist { background: #fff; color: var(--ink); border-radius: var(--radius); padding: 18px 20px; box-shadow: 0 18px 50px rgba(20,60,110,.18); }
  .mylist h3 { margin: 0 0 10px; font-size: 18px; }
  table.games { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.games th { text-align: left; font-size: 12px; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 2px solid #e3e8f0; }
  table.games td { padding: 9px 8px; border-bottom: 1px solid #eef2f7; vertical-align: middle; }
  table.games td.code { font-family: Consolas, monospace; font-weight: 800; letter-spacing: .12em; font-size: 16px; }
  table.games td.acts { white-space: nowrap; text-align: right; }
  table.games td.acts .btn { margin-left: 6px; }
  .empty { color: var(--muted); padding: 16px; text-align: center; }
  footer { margin-top: auto; padding-top: 36px; font-size: 13px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <div class="langfixed" id="langHost"></div>
  <h1><img src="shared/logo.svg?v=202610051251" alt="" style="width:1.1em;height:1.1em;vertical-align:-0.18em;margin-right:.25em">Kara Tahta</h1>
  <p class="sub" data-i18n="home.sub"></p>

  <!-- ===== Giriş yapılmamış: öğrenci kodu + öğretmen girişi ===== -->
  <div class="wrap" id="guest">
    <div class="panel hidden" id="studentPanel">
      <h2 data-i18n="home.studentTitle"></h2>
      <p data-i18n="home.studentSub"></p>
      <form class="code-form" id="joinForm" autocomplete="off">
        <input type="text" id="code" maxlength="5" placeholder="KALE7" autocapitalize="characters" spellcheck="false">
        <button class="btn" id="joinBtn" type="submit" data-i18n="home.join"></button>
      </form>
      <div class="err" id="joinErr"></div>
    </div>

    <div class="panel">
      <h2 data-i18n="home.teacherTitle"></h2>
      <p data-i18n="home.teacherSub"></p>
      <form id="loginForm" autocomplete="on">
        <label for="user" data-i18n="home.user"></label>
        <input type="text" id="user" autocomplete="username" autocapitalize="off" spellcheck="false">
        <label for="pass" data-i18n="home.pass"></label>
        <input type="password" id="pass" autocomplete="current-password">
        <div class="err" id="loginErr"></div>
        <button class="btn" id="loginBtn" type="submit" data-i18n="home.login"></button>
      </form>
    </div>
  </div>

  <!-- ===== Giriş yapılmış: öğretmen paneli ===== -->
  <div class="dash hidden" id="dash">
    <div class="dash-head">
      <h2 style="margin:0" data-i18n="home.myGames"></h2>
    </div>
    <div class="newgames" id="newgames"></div>
    <div class="mylist">
      <h3 data-i18n="home.saved"></h3>
      <div id="list"></div>
    </div>
  </div>

  <footer data-i18n="home.footer"></footer>

<script src="shared/config.js?v=202610051507"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="shared/i18n.js?v=202610051507"></script>
<script src="shared/ui.js?v=202610051507"></script>
<script src="shared/header.js?v=202610051507"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const t = I18N.t;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const SB = window.BP_CONFIG || {};
  const remote = !!(SB.supabaseUrl && SB.supabaseAnonKey && window.supabase);
  const sb = remote ? window.supabase.createClient(SB.supabaseUrl, SB.supabaseAnonKey) : null;
  // Kullanıcı adı → e-posta: Supabase Auth e-posta ister; "@" yoksa bu alan adı eklenir.
  // Yönetici kullanıcıyı Supabase panelinde aynı biçimde (ad@egido.local) açar.
  const USER_DOMAIN = SB.userDomain || 'egido.local';
  const toEmail = u => u.includes('@') ? u : `${u}@${USER_DOMAIN}`;

  // Oyun kataloğu: yeni oyun eklenince buraya bir satır eklenir (adlar i18n.js içinde game.<id>.name / .desc)
  const GAMES = EgidoHeader.GAMES; // katalog tek yerde: shared/header.js
  const gameOf = id => GAMES.find(g => g.id === id) || { id, emoji: '🎮' };
  const gname = g => t('game.' + g.id + '.name') === 'game.' + g.id + '.name' ? g.id : t('game.' + g.id + '.name');

  $('#langHost').innerHTML = I18N.selectorHtml();
  I18N.apply(); I18N.bindSelectors();
  document.addEventListener('egido:lang', () => render());

  // ---------- Öğrenci: kodla katıl ----------
  const codeRe = /^[A-Z2-9]{5}$/;
  const norm = s => s.toLocaleUpperCase('tr').replace(/İ/g, 'I').replace(/Ğ/g, 'G').replace(/Ü/g, 'U').replace(/Ş/g, 'S').replace(/Ö/g, 'O').replace(/Ç/g, 'C')
    .replace(/[^A-Z0-9]/g, '').replace(/0/g, 'O').replace(/1/g, 'I');
  async function join(code) {
    const err = $('#joinErr'), btn = $('#joinBtn');
    code = norm(code);
    if (!codeRe.test(code)) { err.textContent = t('home.codeLen'); return; }
    if (!remote) { err.textContent = t('home.codeOff'); return; }
    err.textContent = ''; btn.disabled = true; btn.textContent = t('home.searching');
    try {
      const { data, error } = await sb.rpc('join_set', { p_code: code });
      if (error) throw error;
      const row = Array.isArray(data) ? data[0] : data;
      if (!row) { err.textContent = t('home.codeNotFound'); showGuest(); return; }
      location.href = `games/${encodeURIComponent(row.game)}/?k=${code}`;
    } catch (e) { err.textContent = t('home.netFail'); showGuest(); }
    finally { btn.disabled = false; btn.textContent = t('home.join'); }
  }
  function showGuest() { // kodla gelen öğrencide hata: mesaj karşılama kutusunda kalır, öğretmen formu açılmaz
    const sp = $('#joining'); if (sp) { sp.textContent = $('#joinErr').textContent; sp.style.color = 'var(--bad)'; }
  }
  $('#joinForm').addEventListener('submit', e => { e.preventDefault(); join($('#code').value); });
  $('#code').addEventListener('input', e => { const v = norm(e.target.value); if (v !== e.target.value) e.target.value = v; });

  // ---------- Öğretmen: giriş ----------
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const err = $('#loginErr'), btn = $('#loginBtn');
    if (!remote) { err.textContent = t('home.noSb'); return; }
    const u = $('#user').value.trim(), p = $('#pass').value;
    if (!u || !p) { err.textContent = t('home.needBoth'); return; }
    err.textContent = ''; btn.disabled = true; btn.textContent = t('home.loggingIn');
    const { error } = await sb.auth.signInWithPassword({ email: toEmail(u), password: p });
    btn.disabled = false; btn.textContent = t('home.login');
    if (error) { err.textContent = t('home.badLogin'); return; }
    render();
  });

  // ---------- Öğretmen paneli ----------
  // Son oynanma: hiç oynanmamışsa "Hiç", 60 günden eskiyse uyarı rengi
  function playedCell(r) {
    if (!r.last_played_at) return `<span style="color:var(--muted)">${t('home.never')}</span>`;
    const d = Math.floor((Date.now() - Date.parse(r.last_played_at)) / 86400000);
    const txt = d <= 0 ? t('home.today') : t('home.daysAgo', { d });
    return d > 60 ? `<span style="color:var(--bad)" title="${t('home.stale')}">⚠ ${txt}</span>` : txt;
  }
  async function render() {
    const session = remote ? (await sb.auth.getSession()).data.session : null;
    $('#guest').classList.toggle('hidden', !!session || !!$('#joining')); // kodla yönlendirme sürerken formlar gizli kalır
    $('#dash').classList.toggle('hidden', !session);
    EgidoHeader.render({ session, sb, root: location.origin + location.pathname.replace(/index\.html$/, ''), active: 'home' });
    $('#langHost').classList.toggle('hidden', !!session); // başlıkta dil seçici var
    if (!session) return;
    $('#newgames').innerHTML = GAMES.map(g => `<a class="gcard" href="games/${g.id}/"><span class="emoji">${g.emoji}</span><span><b>+ ${esc(gname(g))}</b><small>${esc(t('game.' + g.id + '.desc'))}</small></span></a>`).join('');
    $('#list').innerHTML = `<div class="empty">${t('loading')}</div>`;
    let { data, error } = await sb.from('sets').select('id,code,game,title,updated_at,last_played_at').order('updated_at', { ascending: false });
    if (error && error.code === '42703') ({ data, error } = await sb.from('sets').select('id,code,game,title,updated_at').order('updated_at', { ascending: false })); // şema henüz güncellenmediyse
    if (error) { $('#list').innerHTML = `<div class="empty">${t('home.listFail', { e: esc(error.message) })}</div>`; return; }
    if (!data.length) { $('#list').innerHTML = `<div class="empty">${t('home.noGames')}</div>`; return; }
    $('#list').innerHTML = `<table class="games"><thead><tr><th>${t('home.colGame')}</th><th>${t('home.colTitle')}</th><th>${t('home.colCode')}</th><th>${t('home.colDate')}</th><th>${t('home.colPlayed')}</th><th></th></tr></thead><tbody>` +
      data.map(r => { const g = gameOf(r.game); return `<tr>
        <td>${g.emoji} ${esc(gname(g))}</td>
        <td>${esc(r.title || t('home.untitled'))}</td>
        <td class="code">${esc(r.code)}</td>
        <td>${new Date(r.updated_at).toLocaleDateString(I18N.lang)}</td>
        <td>${playedCell(r)}</td>
        <td class="acts">
          <a class="btn small" href="games/${esc(r.game)}/?id=${r.id}&share=1">${t('home.showCode')}</a>
          <a class="btn small secondary" href="games/${esc(r.game)}/?id=${r.id}">${t('home.edit')}</a>
          <button class="btn small secondary del" data-id="${r.id}" data-title="${esc(r.title)}">🗑</button>
        </td></tr>`; }).join('') + '</tbody></table>';
    document.querySelectorAll('.del').forEach(b => b.onclick = async () => {
      if (!(await EgidoUI.confirm(t('home.delConfirm', { t: b.dataset.title || '…' }), { danger: true }))) return;
      const { error } = await sb.from('sets').delete().eq('id', b.dataset.id);
      if (error) EgidoUI.toast(t('home.delFail', { e: error.message }), 'error'); else render();
    });
  }

  // Kısa bağlantıdan gelen öğrenci: egido/#KALE7 → giriş formu gösterilmeden doğrudan oyuna yönlendirilir
  const h = location.hash.replace('#', '');
  if (h) {
    $('#guest').classList.add('hidden');
    const sp = document.createElement('div'); sp.id = 'joining'; sp.className = 'panel'; sp.style.cssText = 'text-align:center;font-size:18px;font-weight:700;width:min(420px,100%)';
    sp.textContent = t('home.searching'); document.querySelector('h1').after(sp);
    $('#code').value = norm(h); join(h);
  }
  render();
})();
</script>
</body>
</html>
